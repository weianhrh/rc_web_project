<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>推广收益流水</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root {
      --primary: #5b8cff;
      --success: #22a06b;
      --danger: #f44336;
      --bg: #f4f6fb;
      --card: #ffffff;
      --border: #e5e7eb;
      --text: #333;
      --muted: #777;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 20px; }
    .page { max-width: 1200px; margin: 0 auto; }
    .title { font-size: 24px; font-weight: 700; margin-bottom: 18px; }
    .card { background: var(--card); border-radius: 12px; padding: 18px; margin-bottom: 18px; box-shadow: 0 4px 20px rgba(0,0,0,.05); }
    .card h3 { font-size: 18px; margin-bottom: 14px; }
    .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; }
    .form-item { width: 180px; }
    .form-item label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
    input { width: 100%; height: 38px; border: 1px solid var(--border); border-radius: 8px; padding: 0 10px; font-size: 14px; outline: none; background: #fff; }
    input:focus { border-color: var(--primary); }
    button { height: 38px; border: none; border-radius: 8px; padding: 0 14px; cursor: pointer; font-size: 14px; color: #fff; background: var(--primary); }
    button:hover { opacity: .9; }
    .btn-secondary { background: #6b7280; }
    .btn-tab { background: #eef2ff; color: var(--primary); border: 1px solid #dbe4ff; }
    .btn-tab.active { background: var(--primary); color: #fff; }
    .msg { margin-top: 12px; padding: 10px 12px; border-radius: 8px; display: none; font-size: 14px; line-height: 1.6; }
    .msg.ok { display: block; background: #e9f8f1; color: #137a4b; border: 1px solid #bcebd6; }
    .msg.err { display: block; background: #fff0f0; color: #c62828; border: 1px solid #ffcaca; }
    .summary { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .metric { border: 1px solid var(--border); border-radius: 10px; padding: 14px; background: #fff; }
    .metric .k { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
    .metric .v { font-size: 22px; font-weight: 800; color: #111827; }
    .metric.primary .v { color: var(--primary); }
    .metric.success .v { color: var(--success); }
    .subline { margin-top: 10px; color: var(--muted); font-size: 13px; line-height: 1.7; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 1000px; }
    th, td { border-bottom: 1px solid var(--border); padding: 10px 8px; text-align: left; font-size: 14px; white-space: nowrap; }
    th { background: #f8f9fc; color: #555; font-weight: 600; }
    tbody tr:hover { background: #fbfcff; }
    .amount { color: var(--success); font-weight: 800; }
    .order-id { max-width: 260px; overflow: hidden; text-overflow: ellipsis; display: inline-block; vertical-align: bottom; }
    .state { text-align: center; color: var(--muted); padding: 26px 0; font-size: 14px; }
    .badge { display: inline-block; padding: 3px 8px; border-radius: 999px; font-size: 12px; background: #e9f8f1; color: #137a4b; }
    .badge.pending { background: #fff7e6; color: #ad6800; }
    .badge.settled { background: #eef2ff; color: #3157c8; }
    .table-head { display: flex; justify-content: space-between; gap: 12px; align-items: center; margin-bottom: 12px; }
    .table-head h3 { margin-bottom: 0; }
    .link-btn { height: 30px; padding: 0 10px; border-radius: 6px; font-size: 13px; }
    .back-btn { display: none; background: #6b7280; }
    .back-btn.show { display: inline-flex; align-items: center; }
    @media (max-width: 768px) {
      body { padding: 12px; }
      .summary { grid-template-columns: 1fr; }
      .toolbar { display: grid; grid-template-columns: 1fr; }
      .table-head { align-items: flex-start; flex-direction: column; }
      .form-item { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="title">推广收益流水</div>

    <div class="card">
      <h3>推广收益动态预估</h3>
      <div class="toolbar">
        <div class="form-item">
          <label for="previewDate">消费日期</label>
          <input id="previewDate" type="date">
        </div>
        <button type="button" id="queryBtn">查询所选日期</button>
        <button type="button" class="btn-secondary" id="todayBtn">今天</button>
      </div>
      <div id="msg" class="msg"></div>
      <div class="subline" id="accountInfo">按当前场地邀请码推广来的历史用户，统计所选日期在其他场地完成的真实消费，并按 10% 动态预估推广收益。</div>
    </div>

    <div class="card">
      <h3>所选日期动态预估收益</h3>
      <div class="summary">
        <div class="metric primary">
          <div class="k">动态预估推广收益</div>
          <div class="v" id="estimatedReward">0.00 元</div>
        </div>
        <div class="metric">
          <div class="k">预估订单数</div>
          <div class="v" id="validOrderCount">0</div>
        </div>
        <div class="metric success">
          <div class="k">综合推广比例</div>
          <div class="v" id="rewardRate">0%</div>
        </div>
      </div>
    </div>

    <div class="card">
      <h3>历史未结算推广收益</h3>
      <div class="summary">
        <div class="metric primary">
          <div class="k">未结算推广收益</div>
          <div class="v" id="pendingReward">0.00 元</div>
        </div>
        <div class="metric">
          <div class="k">未结算订单数</div>
          <div class="v" id="pendingOrderCount">0</div>
        </div>
        <div class="metric success">
          <div class="k">历史综合比例</div>
          <div class="v" id="pendingRewardRate">0%</div>
        </div>
      </div>
      <div class="subline" id="pendingInfo">历史未结算数据来自已落地的 pending 推广收益明细，不包含所选日期动态预估。</div>
    </div>

    <div class="card">
      <h3>已结算推广收益记录</h3>
      <div class="summary">
        <div class="metric primary">
          <div class="k">已结算推广收益</div>
          <div class="v" id="settledReward">0.00 元</div>
        </div>
        <div class="metric">
          <div class="k">已结算订单数</div>
          <div class="v" id="settledOrderCount">0</div>
        </div>
        <div class="metric success">
          <div class="k">已结算综合比例</div>
          <div class="v" id="settledRewardRate">0%</div>
        </div>
      </div>
      <div class="subline" id="settledInfo">已结算数据来自平台确认后的推广收益记录，可点击下方日期查看明细。</div>
    </div>

    <div class="card">
      <div class="table-head">
        <h3 id="tableTitle">按天汇总</h3>
        <button type="button" class="back-btn" id="backSummaryBtn">返回按天汇总</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead id="thead"></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
      <div id="state" class="state">加载中...</div>
    </div>
  </div>

<script>
const API = '/api/promotion/GetInviteRewardPreview.php';
const els = {
  previewDate: document.getElementById('previewDate'),
  queryBtn: document.getElementById('queryBtn'),
  todayBtn: document.getElementById('todayBtn'),
  msg: document.getElementById('msg'),
  accountInfo: document.getElementById('accountInfo'),
  estimatedReward: document.getElementById('estimatedReward'),
  validOrderCount: document.getElementById('validOrderCount'),
  rewardRate: document.getElementById('rewardRate'),
  pendingReward: document.getElementById('pendingReward'),
  pendingOrderCount: document.getElementById('pendingOrderCount'),
  pendingRewardRate: document.getElementById('pendingRewardRate'),
  pendingInfo: document.getElementById('pendingInfo'),
  settledReward: document.getElementById('settledReward'),
  settledOrderCount: document.getElementById('settledOrderCount'),
  settledRewardRate: document.getElementById('settledRewardRate'),
  settledInfo: document.getElementById('settledInfo'),
  tableTitle: document.getElementById('tableTitle'),
  backSummaryBtn: document.getElementById('backSummaryBtn'),
  thead: document.getElementById('thead'),
  tbody: document.getElementById('tbody'),
  state: document.getElementById('state')
};

let dynamicRows = [];
let pendingRows = [];
let settledRows = [];
let dailyRows = [];

function pad(n){ return String(n).padStart(2, '0'); }
function ymd(d){ const x = new Date(d); return `${x.getFullYear()}-${pad(x.getMonth()+1)}-${pad(x.getDate())}`; }
function money(n){ return `${Number(n || 0).toFixed(2)} 元`; }
function esc(v){ return String(v ?? '').replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s])); }
function showMsg(type, text){ els.msg.className = `msg ${type}`; els.msg.textContent = text; }
function clearMsg(){ els.msg.className = 'msg'; els.msg.textContent = ''; }

function renderHead(type){
  if (type === 'detail') {
    els.thead.innerHTML = `
      <tr>
        <th>订单结束/生成时间</th>
        <th>被邀请人</th>
        <th>邀请码</th>
        <th>推广比例</th>
        <th>推广收益</th>
        <th>状态</th>
        <th>订单号</th>
      </tr>`;
    return;
  }
  els.thead.innerHTML = `
    <tr>
      <th>日期</th>
      <th>类型</th>
      <th>推广收益</th>
      <th>订单数</th>
      <th>综合推广比例</th>
      <th>操作</th>
    </tr>`;
}

function rateText(row){
  const explicitRate = row.reward_rate_percent;
  if (explicitRate !== undefined && explicitRate !== null && explicitRate !== '') {
    return `${Number(explicitRate || 0)}%`;
  }
  const amount = Number(row.order_amount || 0);
  if (amount <= 0) return '0%';
  return `${(Number(row.reward_amount || 0) / amount * 100).toFixed(2)}%`;
}

function buildDailyRows(selectedDate, summary, pendingHistory){
  const rows = [{
    type: 'dynamic',
    date: selectedDate,
    typeText: '所选日期动态预估',
    reward_amount: summary.reward_amount ?? summary.settled_reward_amount ?? 0,
    order_count: summary.order_count ?? summary.settled_order_count ?? 0,
    reward_rate_percent: summary.reward_rate_percent || 0
  }];
  (pendingHistory.by_date || []).forEach(row => {
    rows.push({
      type: 'pending',
      date: row.reward_date,
      typeText: '历史待结算',
      reward_amount: row.reward_amount,
      order_count: row.order_count,
      order_amount: row.order_amount,
      reward_rate_percent: row.reward_rate_percent
    });
  });
  return rows;
}

function appendSettledDailyRows(rows, settledHistory){
  (settledHistory.by_date || []).forEach(row => {
    rows.push({
      type: 'settled',
      date: row.reward_date,
      typeText: '已结算',
      reward_amount: row.reward_amount,
      order_count: row.order_count,
      order_amount: row.order_amount,
      reward_rate_percent: row.reward_rate_percent,
      settled_at: row.last_settled_at,
      settlement_batch_ids: row.settlement_batch_ids
    });
  });
  return rows;
}

function renderSummary(){
  renderHead('summary');
  els.tableTitle.textContent = '按天汇总';
  els.backSummaryBtn.classList.remove('show');
  if (!dailyRows.length) {
    els.tbody.innerHTML = '';
    els.state.textContent = '暂无推广收益汇总';
    return;
  }
  els.tbody.innerHTML = dailyRows.map((row, idx) => {
    const badgeClass = row.type === 'settled' ? 'badge settled' : (row.type === 'pending' ? 'badge pending' : 'badge');
    return `
      <tr>
        <td>${esc(row.date)}</td>
        <td><span class="${badgeClass}">${esc(row.typeText)}</span></td>
        <td class="amount">+${money(row.reward_amount)}</td>
        <td>${Number(row.order_count || 0)} 单</td>
        <td>${rateText(row)}</td>
        <td><button type="button" class="link-btn" data-detail-index="${idx}">查看明细</button></td>
      </tr>`;
  }).join('');
  els.state.textContent = `共 ${dailyRows.length} 天汇总`;
}

function renderRows(rows, type){
  renderHead('detail');
  els.backSummaryBtn.classList.add('show');
  if (!rows.length) {
    els.tbody.innerHTML = '';
    const emptyText = {
      dynamic: '该日暂无动态推广收益明细',
      pending: '该日暂无历史未结算推广收益明细',
      settled: '该日暂无已结算推广收益明细'
    };
    els.state.textContent = emptyText[type] || '该日暂无推广收益明细';
    return;
  }
  els.tbody.innerHTML = rows.map(row => {
    const nickname = row.invitee_nickname ? ` / ${esc(row.invitee_nickname)}` : '';
    const timeText = type === 'settled' ? (row.settled_at || row.recorded_at) : (type === 'pending' ? row.recorded_at : row.end_time);
    const badgeText = type === 'settled' ? '已结算' : (type === 'pending' ? '待结算' : '动态预估');
    const badgeClass = type === 'settled' ? 'badge settled' : (type === 'pending' ? 'badge pending' : 'badge');
    return `
      <tr>
        <td>${esc(timeText)}</td>
        <td>${esc(row.invitee_uid)}${nickname}</td>
        <td>${esc(row.invitation_code)}</td>
        <td>${Number(row.reward_rate_percent || 0)}%</td>
        <td class="amount">+${money(row.reward_amount)}</td>
        <td><span class="${badgeClass}">${badgeText}</span></td>
        <td><span class="order-id" title="${esc(row.order_id)}">${esc(row.order_id)}</span></td>
      </tr>`;
  }).join('');
  els.state.textContent = `共 ${rows.length} 条明细`;
}

async function showDailyDetail(index){
  const row = dailyRows[index];
  if (!row) return;
  const detailTitleMap = {
    dynamic: `${row.date} 动态预估明细`,
    pending: `${row.date} 历史未结算明细`,
    settled: `${row.date} 已结算明细`
  };
  els.tableTitle.textContent = detailTitleMap[row.type] || `${row.date} 推广收益明细`;
  els.backSummaryBtn.classList.add('show');
  els.tbody.innerHTML = '';
  els.state.textContent = '明细加载中...';
  try {
    const url = new URL(API, window.location.origin);
    url.searchParams.set('mode', 'detail');
    url.searchParams.set('detail_type', row.type);
    url.searchParams.set('detail_date', row.date);
    const res = await fetch(url.toString(), { credentials: 'include', headers: { 'Accept': 'application/json' }});
    const json = await res.json();
    if (!json || json.code !== 200) {
      throw new Error((json && json.msg) || '明细查询失败');
    }
    renderRows((json.data && json.data.list) || [], row.type);
  } catch (err) {
    showMsg('err', err.message || '明细加载失败，请刷新重试');
    els.state.textContent = '明细加载失败';
  }
}

async function loadPreview(){
  clearMsg();
  const date = els.previewDate.value || ymd(new Date());
  els.state.textContent = '加载中...';
  els.tbody.innerHTML = '';
  try {
    const url = new URL(API, window.location.origin);
    url.searchParams.set('date', date);
    const res = await fetch(url.toString(), { credentials: 'include', headers: { 'Accept': 'application/json' }});
    const json = await res.json();
    if (!json || json.code !== 200) {
      throw new Error((json && json.msg) || '查询失败');
    }
    const data = json.data || {};
    const todayPreview = data.today_preview || {};
    const pendingHistory = data.pending_history || {};
    const settledHistory = data.settled_history || {};
    const summary = todayPreview.summary || data.summary || {};
    const pendingSummary = pendingHistory.summary || {};
    const settledSummary = settledHistory.summary || {};
    dynamicRows = todayPreview.list || data.list || [];
    pendingRows = pendingHistory.list || [];
    settledRows = settledHistory.list || [];
    dailyRows = appendSettledDailyRows(buildDailyRows(date, summary, pendingHistory), settledHistory);

    els.estimatedReward.textContent = money(summary.reward_amount ?? summary.settled_reward_amount);
    els.validOrderCount.textContent = String(summary.order_count ?? summary.settled_order_count ?? 0);
    els.rewardRate.textContent = `${Number(summary.reward_rate_percent || 0)}%`;
    els.pendingReward.textContent = money(pendingSummary.reward_amount);
    els.pendingOrderCount.textContent = String(pendingSummary.order_count || 0);
    els.pendingRewardRate.textContent = `${Number(pendingSummary.reward_rate_percent || 0)}%`;
    els.pendingInfo.textContent = `历史未结算数据来自已落地的 pending 推广收益明细，不包含所选日期动态预估。当前未结算 ${Number(pendingSummary.order_count || 0)} 条。`;
    els.settledReward.textContent = money(settledSummary.reward_amount);
    els.settledOrderCount.textContent = String(settledSummary.order_count || 0);
    els.settledRewardRate.textContent = `${Number(settledSummary.reward_rate_percent || 0)}%`;
    els.settledInfo.textContent = `已结算推广收益来自平台确认后的 settled 记录。当前展示最近 ${Number(settledSummary.order_count || 0)} 条已结算明细对应的汇总。`;
    els.accountInfo.textContent = `收益归属场地：${data.venue_name || '-'}（ID：${data.venue_id || '-'}）　邀请码：${data.invite_code || '-'}。口径：历史推广用户在其他场地完成消费，按 payment_amount × 10% 动态预估。`;
    renderSummary();
  } catch (err) {
    showMsg('err', err.message || '网络异常，请刷新重试');
    els.state.textContent = '加载失败';
  }
}

els.queryBtn.addEventListener('click', loadPreview);
els.todayBtn.addEventListener('click', () => { els.previewDate.value = ymd(new Date()); loadPreview(); });
els.backSummaryBtn.addEventListener('click', renderSummary);
els.tbody.addEventListener('click', event => {
  const btn = event.target.closest('[data-detail-index]');
  if (!btn) return;
  showDailyDetail(Number(btn.dataset.detailIndex));
});
els.previewDate.value = ymd(new Date());
loadPreview();
</script>
</body>
</html>
