<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>开播时长统计</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root {
            --primary: #5b8cff;
            --background-gradient-start: #f8f9ff;
            --background-gradient-end: #f0f3ff;
            --card-bg: #ffffff;
            --border-color: #e5e7eb;
            --text-color: #333;
            --shadow: 0 4px 24px rgba(91, 140, 255, 0.08);
            --danger: #ff4d4f;
            --success: #18a058;
            --warning: #f59e0b;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: "PingFang SC", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        body { background: linear-gradient(135deg, var(--background-gradient-start) 0%, var(--background-gradient-end) 100%); min-height: 100vh; padding: 20px; color: var(--text-color); }
        .container { max-width: 1280px; margin: 0 auto; }
        .card { background: var(--card-bg); border-radius: 14px; padding: 20px; box-shadow: var(--shadow); margin-bottom: 20px; }
        .card-title { font-size: 24px; font-weight: 700; padding-bottom: 12px; border-bottom: 2px solid var(--primary); margin-bottom: 18px; }
        .toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 16px; }
        .form-item { display: flex; align-items: center; gap: 8px; }
        .form-item label { font-size: 14px; color: #555; white-space: nowrap; }
        select, input[type="date"], button { height: 38px; border-radius: 8px; font-size: 14px; }
        select, input[type="date"] { border: 1px solid var(--border-color); padding: 0 10px; background: #fff; color: var(--text-color); }
        select { min-width: 240px; }
        input[type="date"] { min-width: 160px; }
        button { border: none; padding: 0 16px; cursor: pointer; background: var(--primary); color: #fff; }
        button.secondary { background: #64748b; }
        button:disabled { cursor: not-allowed; opacity: 0.65; }
        .summary { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; width: 100%; margin-bottom: 18px; }
        .stat, .stat.range-stat { width: 100%; min-width: 0; height: 100%; background: #f4f7ff; border: 1px solid #e2e8ff; border-radius: 12px; padding: 14px 16px; }
        .stat .label { color: #64748b; font-size: 13px; margin-bottom: 6px; }
        .stat .value { min-width: 0; font-size: 22px; font-weight: 700; color: var(--primary); }
        #stat_range { font-size: 18px; white-space: normal; overflow-wrap: anywhere; }
        .table-wrap { overflow-x: auto; border: 1px solid var(--border-color); border-radius: 12px; background: #fff; margin-top: 12px; }
        table { width: 100%; border-collapse: collapse; min-width: 900px; }
        th, td { padding: 12px 10px; border-bottom: 1px solid var(--border-color); text-align: left; font-size: 13px; white-space: nowrap; }
        th { background: #f8fafc; font-weight: 700; color: #334155; }
        tr:hover td { background: #f9fbff; }
        .badge { display: inline-flex; align-items: center; justify-content: center; padding: 4px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; }
        .badge-live { background: #e8f8ef; color: var(--success); }
        .badge-close { background: #eef2ff; color: var(--primary); }
        .badge-history { background: #fff7e6; color: var(--warning); }
        .empty, .loading { padding: 30px; text-align: center; color: #777; }
        .role-tip { font-size: 13px; color: #64748b; margin-bottom: 10px; }
        @media (max-width: 860px) {
            body { padding: 12px; }
            .card { padding: 14px; }
            .toolbar { flex-direction: column; align-items: stretch; }
            .form-item { width: 100%; align-items: stretch; flex-direction: column; gap: 6px; }
            select, input[type="date"], button { width: 100%; min-width: 0; }
            .summary {
                grid-template-columns: minmax(0, 1fr);
                grid-auto-rows: 1fr;
                gap: 10px;
            }
            .stat,
            .stat.range-stat {
                width: 100%;
                min-width: 0;
                min-height: 78px;
                padding: 12px 14px;
            }
            .stat .value { line-height: 1.3; }
            #stat_range {
                font-size: 18px;
                white-space: normal;
                overflow-wrap: anywhere;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <div class="card-title">开播时长统计</div>
        <div id="role_tip" class="role-tip">加载权限中...</div>

        <div class="toolbar" id="toolbar">
            <div class="form-item">
                <label for="start_date_input">开始日期</label>
                <input type="date" id="start_date_input">
            </div>
            <div class="form-item">
                <label for="end_date_input">结束日期</label>
                <input type="date" id="end_date_input">
            </div>
            <div class="form-item" id="venue_filter_box" style="display:none;">
                <label for="venue_id">场地</label>
                <select id="venue_id">
                    <option value="0">全部场地</option>
                </select>
            </div>
            <button id="query_button" onclick="loadStats()">查询</button>
            <button id="reset_button" class="secondary" onclick="resetSearch()">重置</button>
        </div>

        <div class="summary">
            <div class="stat">
                <div class="label">所选日期范围开播总时间</div>
                <div class="value" id="total_duration">00:00:00</div>
            </div>
            <div class="stat">
                <div class="label">所选日期范围开关播阶段数</div>
                <div class="value" id="segment_count">0</div>
            </div>
            <div class="stat range-stat">
                <div class="label">统计范围</div>
                <div class="value" id="stat_range">-</div>
            </div>
        </div>

        <div class="table-wrap" id="venue_total_wrap" style="display:none;">
            <table>
                <thead>
                <tr>
                    <th>场地</th>
                    <th>所选日期范围总开播时间</th>
                    <th>阶段数</th>
                </tr>
                </thead>
                <tbody id="venue_total_tbody"></tbody>
            </table>
        </div>

        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th>场地</th>
                    <th>开播时间</th>
                    <th>关播时间</th>
                    <th>本阶段统计开始</th>
                    <th>本阶段统计结束</th>
                    <th>每次开关播总时间</th>
                    <th>状态</th>
                </tr>
                </thead>
                <tbody id="segment_tbody">
                <tr><td colspan="7" class="loading">加载中...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const USER_API = '/api/operat/get_current_user.php';
    const STATS_API = '/api/operat/venueLiveDuration.php';
    const VENUE_API = STATS_API;

    let currentUser = null;
    let statsXhr = null;
    let statsRequestKey = '';
    let statsRequestSequence = 0;

    window.addEventListener('pagehide', function () {
        if (statsXhr && statsXhr.readyState !== 4) {
            statsXhr.abort();
        }
    });

    document.addEventListener('DOMContentLoaded', function () {
        resetDateInputs();
        loadCurrentUser(function () {
            const roleId = Number(currentUser.role_id);
            applyRoleView();

            if ([1, 2].includes(roleId)) {
                loadVenues(function () {
                    loadStats();
                });
            } else if ([3, 4].includes(roleId)) {
                loadStats();
            }
        });
    });

    function loadCurrentUser(callback) {
        const xhr = new XMLHttpRequest();
        xhr.open('GET', USER_API, true);
        xhr.onreadystatechange = function () {
            if (xhr.readyState !== 4) return;
            try {
                const res = JSON.parse(xhr.responseText);
                if (res.code !== 0) {
                    document.getElementById('role_tip').textContent = res.msg || '未登录';
                    document.getElementById('segment_tbody').innerHTML = '<tr><td colspan="7" class="empty">未登录或无权访问</td></tr>';
                    return;
                }
                currentUser = res.data;
                callback();
            } catch (e) {
                document.getElementById('role_tip').textContent = '当前用户信息解析失败';
            }
        };
        xhr.send();
    }

    function applyRoleView() {
        const roleId = Number(currentUser.role_id);
        const venueSelect = document.getElementById('venue_id');
        const venueFilterBox = document.getElementById('venue_filter_box');
        const roleTip = document.getElementById('role_tip');

        if ([1, 2].includes(roleId)) {
            roleTip.textContent = roleId === 1
                ? '当前权限：超级管理员，可筛选全部场地及历史日期范围。'
                : '当前权限：运营管理员，可筛选全部场地及历史日期范围。';
            venueSelect.disabled = false;
            venueFilterBox.style.display = 'flex';
        } else if ([3, 4].includes(roleId)) {
            roleTip.textContent = roleId === 3
                ? '当前权限：加盟商账号，仅查询账号绑定场地，可筛选历史日期范围。'
                : '当前权限：场地账号，仅查询账号绑定场地，可筛选历史日期范围。';
            venueSelect.disabled = true;
            venueFilterBox.style.display = 'none';
        } else {
            roleTip.textContent = '当前角色无权查看';
            document.getElementById('toolbar').style.display = 'none';
        }
    }

    function loadVenues(callback) {
        if (![1, 2].includes(Number(currentUser.role_id))) {
            callback();
            return;
        }

        const venueSelect = document.getElementById('venue_id');
        const xhr = new XMLHttpRequest();
        xhr.open('POST', VENUE_API, true);
        xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
        xhr.onreadystatechange = function () {
            if (xhr.readyState !== 4) return;
            try {
                const response = JSON.parse(xhr.responseText);
                if (response.code === 0 && Array.isArray(response.data)) {
                    response.data.forEach(venue => {
                        const option = document.createElement('option');
                        option.value = venue.id;
                        option.textContent = `${venue.id} - ${venue.venue_name}`;
                        venueSelect.appendChild(option);
                    });
                }
            } catch (e) {
                console.error('场地下拉框加载失败', e);
            } finally {
                callback();
            }
        };
        xhr.send('action=get_venues');
    }

    function resetSearch() {
        resetDateInputs();
        if ([1, 2].includes(Number(currentUser.role_id))) {
            document.getElementById('venue_id').value = '0';
        }
        loadStats();
    }

    function getBusinessDateString() {
        try {
            const parts = new Intl.DateTimeFormat('zh-CN', {
                timeZone: 'Asia/Shanghai',
                year: 'numeric',
                month: '2-digit',
                day: '2-digit'
            }).formatToParts(new Date());
            const dateParts = {};
            parts.forEach(part => {
                if (part.type !== 'literal') {
                    dateParts[part.type] = part.value;
                }
            });
            return `${dateParts.year}-${dateParts.month}-${dateParts.day}`;
        } catch (e) {
            // 中国大陆全年固定 UTC+8；Intl 不可用时仍按北京时间取日期。
            return new Date(Date.now() + 8 * 60 * 60 * 1000)
                .toISOString()
                .slice(0, 10);
        }
    }

    function resetDateInputs() {
        const startDateInput = document.getElementById('start_date_input');
        const endDateInput = document.getElementById('end_date_input');
        const today = getBusinessDateString();
        startDateInput.max = today;
        endDateInput.max = today;
        startDateInput.value = today;
        endDateInput.value = today;
        document.getElementById('stat_range').textContent = today;
    }

    function loadStats() {
        const tbody = document.getElementById('segment_tbody');

        if (!currentUser || ![1, 2, 3, 4].includes(Number(currentUser.role_id))) {
            tbody.innerHTML = '<tr><td colspan="7" class="empty">当前角色无权查看</td></tr>';
            return;
        }

        const roleId = Number(currentUser.role_id);
        let venueId = document.getElementById('venue_id').value;
        const startDateInput = document.getElementById('start_date_input');
        const endDateInput = document.getElementById('end_date_input');
        const today = getBusinessDateString();
        let startDate = startDateInput.value || today;
        let endDate = endDateInput.value || today;

        if (!startDateInput.value) {
            startDateInput.value = today;
        }
        if (!endDateInput.value) {
            endDateInput.value = today;
        }

        if (startDate > today) {
            tbody.innerHTML = '<tr><td colspan="7" class="empty">开始日期不能是未来日期</td></tr>';
            return;
        }
        if (endDate > today) {
            tbody.innerHTML = '<tr><td colspan="7" class="empty">结束日期不能是未来日期</td></tr>';
            return;
        }
        if (startDate > endDate) {
            document.getElementById('stat_range').textContent = `${startDate} 至 ${endDate}`;
            document.getElementById('total_duration').textContent = '00:00:00';
            document.getElementById('segment_count').textContent = '0';
            document.getElementById('venue_total_wrap').style.display = 'none';
            tbody.innerHTML = '<tr><td colspan="7" class="empty">开始日期不能晚于结束日期，请重新选择</td></tr>';
            return;
        }

        const requestedRange = startDate === endDate ? startDate : `${startDate} 至 ${endDate}`;
        document.getElementById('stat_range').textContent = requestedRange;
        const params = new URLSearchParams();
        params.append('action', 'get_live_duration');
        if ([1, 2].includes(roleId)) {
            params.append('venue_id', venueId);
        }
        params.append('startday', startDate);
        params.append('endday', endDate);

        const requestKey = params.toString();
        if (statsXhr && statsXhr.readyState !== 4) {
            if (statsRequestKey === requestKey) {
                return;
            }
            statsXhr.abort();
        }

        tbody.innerHTML = '<tr><td colspan="7" class="loading">加载中...</td></tr>';
        setStatsLoading(true);

        const requestSequence = ++statsRequestSequence;
        const xhr = new XMLHttpRequest();
        statsXhr = xhr;
        statsRequestKey = requestKey;
        xhr.open('POST', STATS_API, true);
        xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
        xhr.timeout = 20000;
        xhr.onload = function () {
            if (requestSequence !== statsRequestSequence) return;
            if (xhr.status < 200 || xhr.status >= 300) {
                tbody.innerHTML = `<tr><td colspan="7" class="empty">请求失败（HTTP ${xhr.status}），请检查服务器日志</td></tr>`;
                return;
            }
            try {
                const response = JSON.parse(xhr.responseText);
                if (response.code !== 0) {
                    tbody.innerHTML = `<tr><td colspan="7" class="empty">${escapeHtml(response.msg || '查询失败')}</td></tr>`;
                    return;
                }
                renderStats(response.data, startDate, endDate);
            } catch (e) {
                tbody.innerHTML = '<tr><td colspan="7" class="empty">返回数据解析失败</td></tr>';
            }
        };
        xhr.onerror = function () {
            if (requestSequence !== statsRequestSequence) return;
            tbody.innerHTML = '<tr><td colspan="7" class="empty">网络请求失败，请稍后重试</td></tr>';
        };
        xhr.ontimeout = function () {
            if (requestSequence !== statsRequestSequence) return;
            tbody.innerHTML = '<tr><td colspan="7" class="empty">统计超过20秒，已停止等待；请确认已执行统计索引SQL</td></tr>';
        };
        xhr.onloadend = function () {
            if (requestSequence !== statsRequestSequence) return;
            statsXhr = null;
            statsRequestKey = '';
            setStatsLoading(false);
        };
        xhr.send(params.toString());
    }

    function setStatsLoading(isLoading) {
        const queryButton = document.getElementById('query_button');
        const resetButton = document.getElementById('reset_button');
        queryButton.disabled = isLoading;
        resetButton.disabled = isLoading;
        queryButton.textContent = isLoading ? '查询中...' : '查询';
    }

    function renderStats(data, requestedStartDate, requestedEndDate) {
        const segments = data.segments || [];
        const venueTotals = data.venue_totals || [];
        const tbody = document.getElementById('segment_tbody');

        document.getElementById('total_duration').textContent = formatSeconds(data.total_seconds || 0);
        document.getElementById('segment_count').textContent = segments.length;
        const rangeStart = data.startday || data.start_date || requestedStartDate || '';
        const rangeEnd = data.endday || data.end_date || requestedEndDate || rangeStart;
        const displayRange = data.date_range || (rangeStart === rangeEnd ? rangeStart : `${rangeStart} 至 ${rangeEnd}`) || '-';
        document.getElementById('stat_range').textContent = displayRange;

        renderVenueTotals(venueTotals, Number(data.role_id));

        if (segments.length === 0) {
            tbody.innerHTML = `<tr><td colspan="7" class="empty">所选日期范围（${escapeHtml(displayRange)}）暂无开播记录</td></tr>`;
            return;
        }

        const selectedEndIsToday = rangeEnd === getBusinessDateString();
        tbody.innerHTML = segments.map(row => {
            const venueText = `${row.venue_id || ''} - ${row.venue_name || ''}`;
            const hasNoCloseLog = Number(row.is_living) === 1;
            const statusBadge = hasNoCloseLog
                ? (selectedEndIsToday
                    ? '<span class="badge badge-live">直播中</span>'
                    : '<span class="badge badge-history">统计结束时仍开播</span>')
                : '<span class="badge badge-close">已关播</span>';
            const closeTimeText = row.close_time || (selectedEndIsToday ? '未关播' : '未记录关播');

            return `
                <tr>
                    <td>${escapeHtml(venueText)}</td>
                    <td>${escapeHtml(row.open_time || '')}</td>
                    <td>${escapeHtml(closeTimeText)}</td>
                    <td>${escapeHtml(row.calc_start || '')}</td>
                    <td>${escapeHtml(row.calc_end || '')}</td>
                    <td>${formatSeconds(row.duration_seconds || 0)}</td>
                    <td>${statusBadge}</td>
                </tr>
            `;
        }).join('');
    }

    function renderVenueTotals(list, roleId) {
        const wrap = document.getElementById('venue_total_wrap');
        const tbody = document.getElementById('venue_total_tbody');

        // role_id=1/2 查看多个场地时显示按场地汇总；role_id=3/4 仅显示绑定场地。
        if (![1, 2].includes(roleId) || list.length <= 1) {
            wrap.style.display = 'none';
            return;
        }

        wrap.style.display = 'block';
        tbody.innerHTML = list.map(row => `
            <tr>
                <td>${escapeHtml((row.venue_id || '') + ' - ' + (row.venue_name || ''))}</td>
                <td>${formatSeconds(row.total_seconds || 0)}</td>
                <td>${row.segment_count || 0}</td>
            </tr>
        `).join('');
    }

    function formatSeconds(seconds) {
        seconds = Number(seconds || 0);
        const h = Math.floor(seconds / 3600);
        const m = Math.floor((seconds % 3600) / 60);
        const s = seconds % 60;
        return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
    }

    function escapeHtml(value) {
        return String(value === null || value === undefined ? '' : value)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    }
</script>
</body>
</html>
