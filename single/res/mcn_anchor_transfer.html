<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MCN主播调配</title><link rel="stylesheet" href="/res/fa/css/all.min.css"><link rel="stylesheet" href="/res/mcn-anchor-transfer.css?v=1"></head><body><main>
<header><a href="/res/index.html"><i class="fas fa-chevron-left"></i> 工作台</a><h1>主播调配</h1><button id="refresh" title="刷新" aria-label="刷新"><i class="fas fa-sync-alt"></i></button></header><p id="organization">正在读取机构…</p>
<div class="tabs" role="tablist"><button id="anchorsTab" role="tab" aria-selected="true">旗下主播</button><button id="logsTab" role="tab" aria-selected="false">调配记录</button></div><div id="notice" role="status"></div>
<section id="anchorsPanel"><div class="toolbar"><input id="search" placeholder="主播昵称 / UID" aria-label="搜索主播"><select id="venueFilter" aria-label="按场地筛选"><option value="">全部场地</option></select><span id="count"></span></div><div class="table-wrap"><table><thead><tr><th>主播</th><th>UID</th><th>当前绑定场地</th><th>操作</th></tr></thead><tbody id="anchors"></tbody></table></div></section>
<section id="logsPanel" hidden><p>最近50次调配记录</p><div class="table-wrap"><table><thead><tr><th>时间</th><th>主播</th><th>原场地</th><th>目标场地</th><th>操作账号ID</th></tr></thead><tbody id="logs"></tbody></table></div></section>
<dialog id="dialog"><div class="dialog-head"><h2>更换主播场地</h2><button id="close" title="关闭" aria-label="关闭"><i class="fas fa-times"></i></button></div><p id="anchorInfo"></p><label for="target">目标场地</label><select id="target"></select><p class="note">仅更换App主播场地，并同步已有的主播工作台。不会移动车辆、订单、历史收益或邀请码。App端如仍显示旧场地，请刷新资料或重新登录。</p><div id="dialogError" role="alert"></div><div class="actions"><button id="cancel">取消</button><button id="save" class="primary">确认调配</button></div></dialog>
</main><script src="/res/mcn-anchor-transfer.js?v=1"></script></body></html>
