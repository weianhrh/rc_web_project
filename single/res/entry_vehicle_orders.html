<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>座驾订单</title>
<style>
:root{--primary:#5b8cff;--bg1:#f8f9ff;--bg2:#f0f3ff;--card:#fff;--border:#e6e8ef;--text:#303442;--muted:#7f8fa4;--danger:#d14343;--success:#13915c;--shadow:0 4px 24px rgba(91,140,255,.08)}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:16px;color:var(--text);background:linear-gradient(135deg,var(--bg1),var(--bg2));font-family:"PingFang SC",system-ui,-apple-system,"Segoe UI",sans-serif}.container{width:100%;max-width:1480px;margin:auto}.card{padding:20px;background:#fff;border-radius:14px;box-shadow:var(--shadow)}.title{padding-bottom:10px;margin-bottom:14px;border-bottom:2px solid var(--primary);font-size:22px;font-weight:700}.tabs{display:flex;gap:8px;padding-bottom:12px;margin-bottom:14px;border-bottom:1px solid var(--border);flex-wrap:wrap}.tab{height:34px;padding:0 18px;border:1px solid var(--border);border-radius:999px;background:#fff;color:#666;cursor:pointer}.tab.active{border-color:var(--primary);background:var(--primary);color:#fff}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.input,.select{height:38px;padding:0 12px;border:1px solid var(--border);border-radius:10px;background:#fff;font-size:14px}.input{min-width:190px}.select{min-width:130px}.btn{height:38px;padding:0 15px;border:0;border-radius:10px;cursor:pointer;font-size:14px}.btn-primary{background:var(--primary);color:#fff}.btn-ghost{border:1px solid var(--border);background:#fff;color:var(--text)}.btn-s{height:31px;padding:0 10px;font-size:12px}.thead,.row{display:grid;grid-template-columns:180px minmax(250px,1.25fr) 115px 110px 210px 190px 90px;gap:12px;align-items:center}.thead{padding:12px 0;border-bottom:1px dashed var(--border);color:#666;font-weight:600}.row{padding:14px 0;border-bottom:1px dashed #edf0f5}.user strong{display:block}.small{font-size:12px;color:var(--muted);line-height:1.55;word-break:break-all}.vehicle{display:flex;gap:10px;align-items:center;min-width:0}.thumb{width:58px;height:58px;flex:0 0 auto;border:1px solid #edf0f5;border-radius:11px;object-fit:contain;background:#fbfbfd}.name{font-weight:700;color:#2b59ff}.money{font-weight:700}.countdown{margin-top:4px;font-size:12px;font-weight:600}.countdown.active{color:var(--success)}.countdown.expired{color:var(--danger)}.badge{display:inline-flex;padding:4px 9px;border-radius:999px;font-size:12px}.badge.active{background:#effcf5;color:var(--success)}.badge.expired{background:#fff1f1;color:var(--danger)}.empty{padding:70px 20px;text-align:center;color:var(--muted)}.pager{display:flex;align-items:center;justify-content:flex-end;gap:8px;padding-top:16px}.page-info{color:var(--muted);font-size:13px}.modal-mask{position:fixed;z-index:20;inset:0;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(21,25,34,.48)}.modal-mask.show{display:flex}.modal{width:min(1080px,100%);max-height:92vh;overflow:auto;border-radius:16px;background:#fff;box-shadow:0 24px 80px rgba(0,0,0,.22)}.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--border);font-size:19px;font-weight:700}.close{border:0;background:none;font-size:25px;cursor:pointer;color:#8a8f9a}.detail-body{padding:16px 22px 22px}.detail-summary{padding:12px 14px;margin-bottom:12px;border-radius:10px;background:#f5f7ff;color:#4a5670}.order-table{width:100%;border-collapse:collapse;font-size:13px}.order-table th,.order-table td{padding:10px 8px;border-bottom:1px solid #edf0f5;text-align:left;white-space:nowrap}.order-table th{color:#687386}.toast{position:fixed;z-index:40;left:50%;bottom:30px;transform:translate(-50%,18px);padding:11px 20px;border-radius:999px;background:rgba(27,31,40,.92);color:#fff;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:1150px){.thead{display:none}.row{grid-template-columns:1fr 1fr;padding:15px;border:1px solid var(--border);border-radius:12px;margin-bottom:10px}.row>div::before{content:attr(data-label);display:block;margin-bottom:4px;color:var(--muted);font-size:11px}.row .vehicle{grid-column:1/-1}.order-table{min-width:900px}.detail-body{overflow:auto}}@media(max-width:620px){body{padding:8px}.card{padding:12px}.row{grid-template-columns:1fr}.row .vehicle{grid-column:auto}.input,.select{width:100%;min-width:0}.pager{flex-wrap:wrap}.modal{max-height:96vh}}
</style>
</head>
<body>
<div class="container"><section class="card"><div class="title">礼物与座驾管理</div><div class="tabs"><button class="tab" onclick="location.href='gift_admin.html'">礼物管理</button><button class="tab" onclick="location.href='entry_vehicle_admin.html'">座驾管理</button><button class="tab active">座驾订单</button></div>
<div class="toolbar"><input id="uid" class="input" type="number" min="1" placeholder="按UID精确搜索"><input id="orderNo" class="input" placeholder="搜索订单号"><select id="expiry" class="select"><option value="">全部有效状态</option><option value="active">未到期</option><option value="expired">已到期</option></select><button id="search" class="btn btn-primary">搜索</button><button id="reset" class="btn btn-ghost">重置</button></div>
<div class="thead"><div>用户</div><div>座驾</div><div>购买/续费</div><div>累计支付</div><div>权益到期</div><div>最近订单</div><div>操作</div></div><div id="list"><div class="empty">正在加载...</div></div>
<div class="pager"><span id="pageInfo" class="page-info"></span><select id="pageSize" class="select" style="min-width:90px"><option>10</option><option selected>20</option><option>50</option><option>100</option></select><button id="prev" class="btn btn-ghost btn-s">上一页</button><button id="next" class="btn btn-ghost btn-s">下一页</button></div></section></div>
<div id="mask" class="modal-mask"><div class="modal"><div class="modal-head"><span id="modalTitle">订单明细</span><button id="close" class="close">×</button></div><div id="detail" class="detail-body"><div class="empty">正在加载...</div></div></div></div><div id="toast" class="toast"></div>
<script>
(()=>{'use strict';const API='/api/operat/entry_vehicle_orders.php';const $=id=>document.getElementById(id);const state={page:1,pageSize:20,total:0,totalPage:0,uid:'',orderNo:'',expiry:'',list:[]};const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const money=v=>Number(v||0).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});const qs=o=>new URLSearchParams(Object.entries(o).filter(([,v])=>v!==''&&v!==null&&v!==undefined)).toString();function toast(m){$('toast').textContent=m;$('toast').classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').classList.remove('show'),2200)}async function api(act,params){const r=await fetch(`${API}?act=${act}&${qs(params||{})}`,{credentials:'include'});const j=await r.json().catch(()=>({ok:0,msg:'服务器返回格式错误'}));if(!j.ok)throw new Error(j.msg||'请求失败');return j.data||{}}function secondsToText(seconds){seconds=Math.max(0,Math.floor(seconds));const d=Math.floor(seconds/86400),h=Math.floor(seconds%86400/3600),m=Math.floor(seconds%3600/60),s=seconds%60;return d>0?`${d}天 ${h}小时 ${m}分`:`${h}小时 ${m}分 ${s}秒`}function expireStamp(value){const v=String(value||'').replace(' ','T');const t=Date.parse(v+'+08:00');return Number.isFinite(t)?t:0}function refreshCountdown(){document.querySelectorAll('[data-expire]').forEach(el=>{const left=Math.floor((Number(el.dataset.expire)-Date.now())/1000);el.textContent=left>0?'剩余 '+secondsToText(left):'已到期';el.className='countdown '+(left>0?'active':'expired')})}function render(){if(!state.list.length){$('list').innerHTML='<div class="empty">暂无符合条件的座驾订单</div>'}else{$('list').innerHTML=state.list.map(x=>{const active=!x.is_expired&&Number(x.remaining_seconds)>0;return `<div class="row"><div class="user" data-label="用户"><strong>${esc(x.nickname||'未设置昵称')}</strong><div class="small">UID：${x.uid}</div><div class="small">${esc(x.phone_number||'')}</div></div><div class="vehicle"><img class="thumb" src="${esc(x.effect_image_url)}"><div><div class="name">${esc(x.effect_name||'未知座驾')}</div><div class="small">${esc(x.purchase_id||'')} / 商品ID ${x.product_id}</div></div></div><div data-label="购买/续费"><strong>${x.purchase_count}次</strong><div class="small">购买1次 / 续费${x.renewal_count}次</div></div><div data-label="累计支付" class="money">￥${money(x.total_paid)}</div><div data-label="权益到期"><span class="badge ${active?'active':'expired'}">${active?'未到期':'已到期'}</span><div class="small">${esc(x.expire_time)}</div><div data-expire="${expireStamp(x.expire_time)}"></div></div><div data-label="最近订单"><div>${esc(x.latest_order_no)}</div><div class="small">${esc(x.last_purchase_time)}</div></div><div data-label="操作"><button class="btn btn-ghost btn-s" data-detail="${x.uid}:${x.product_id}">查看订单</button></div></div>`}).join('')}state.totalPage=Math.max(1,Math.ceil(state.total/state.pageSize));$('pageInfo').textContent=`共 ${state.total} 组　第 ${state.page}/${state.totalPage} 页`;$('prev').disabled=state.page<=1;$('next').disabled=state.page>=state.totalPage;document.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>{const [uid,pid]=b.dataset.detail.split(':').map(Number);openDetail(uid,pid)});refreshCountdown()}async function load(){try{$('list').innerHTML='<div class="empty">正在加载...</div>';const d=await api('list',{page:state.page,page_size:state.pageSize,uid:state.uid,order_no:state.orderNo,expiry_status:state.expiry});state.list=d.list||[];state.total=Number(d.pagination?.total||0);render()}catch(e){$('list').innerHTML=`<div class="empty" style="color:#d14343">${esc(e.message)}</div>`}}async function openDetail(uid,pid){const summary=state.list.find(x=>Number(x.uid)===uid&&Number(x.product_id)===pid);$('modalTitle').textContent='订单明细';$('detail').innerHTML='<div class="empty">正在加载...</div>';$('mask').classList.add('show');try{const d=await api('detail',{uid,product_id:pid});const rows=d.list||[];$('detail').innerHTML=`<div class="detail-summary">UID：${uid}　座驾：${esc(summary?.effect_name||'')}　共 ${rows.length} 笔购买/续费记录</div><table class="order-table"><thead><tr><th>订单号</th><th>类型</th><th>支付金额</th><th>扣款前</th><th>扣款后</th><th>权益开始</th><th>购买后到期</th><th>购买时间</th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td>${esc(r.order_no)}</td><td>${i===rows.length-1?'首次购买':'续费'}</td><td>￥${money(r.price_paid)}</td><td>￥${money(r.balance_before)}</td><td>￥${money(r.balance_after)}</td><td>${esc(r.start_time)}</td><td>${esc(r.expire_time)}</td><td>${esc(r.last_purchase_time)}</td></tr>`).join('')}</tbody></table>`}catch(e){$('detail').innerHTML=`<div class="empty" style="color:#d14343">${esc(e.message)}</div>`}}function close(){$('mask').classList.remove('show')}$('search').onclick=()=>{state.uid=$('uid').value.trim();state.orderNo=$('orderNo').value.trim();state.expiry=$('expiry').value;state.page=1;load()};$('reset').onclick=()=>{$('uid').value='';$('orderNo').value='';$('expiry').value='';state.uid='';state.orderNo='';state.expiry='';state.page=1;load()};$('pageSize').onchange=e=>{state.pageSize=Number(e.target.value);state.page=1;load()};$('prev').onclick=()=>{if(state.page>1){state.page--;load()}};$('next').onclick=()=>{if(state.page<state.totalPage){state.page++;load()}};$('close').onclick=close;$('mask').onclick=e=>{if(e.target===$('mask'))close()};$('orderNo').onkeydown=e=>{if(e.key==='Enter')$('search').click()};setInterval(refreshCountdown,1000);load()})();
</script>
</body></html>
