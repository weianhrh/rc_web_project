<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>收入明细</title>
    <link rel="stylesheet" href="/res/fa/css/all.min.css">
    <style>
        :root {
            --primary: #5b8cff;
            --secondary: #7f8fa4;
            --background-gradient-start: #f8f9ff;
            --background-gradient-end: #f0f3ff;
            --card-bg: #ffffff;
            --border-color: #ddd;
            --text-color: #333;
            --shadow: 0 4px 24px rgba(91, 140, 255, 0.08);
            --transition: all 0.3s ease;
            --hover-bg: #f9f9f9;
            --highlight-bg: #eff4ff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "PingFang SC", system-ui;
        }

        body {
            background: linear-gradient(135deg, var(--background-gradient-start) 0%, var(--background-gradient-end) 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .container {
            max-width: 1200px;
            width: 100%;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: var(--shadow);
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: var(--transition);
        }

        .card:hover {
            box-shadow: 0 8px 32px rgba(91, 140, 255, 0.16);
        }

        .card-title {
            font-size: 24px;
            color: var(--text-color);
            margin-bottom: 20px;
            font-weight: 600;
            border-bottom: 2px solid var(--primary);
            padding-bottom: 10px;
        }

        .total-amount {
            float: right;
            font-size: 16px;
            font-weight: normal;
            color: var(--primary);
        }

        .order-type-tabs {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }

        .tab-btn {
            padding: 8px 16px;
            border: 1px solid var(--primary);
            background: #fff;
            color: var(--primary);
            border-radius: 999px;
            cursor: pointer;
            transition: var(--transition);
            font-size: 14px;
        }

        .tab-btn.active {
            background: var(--primary);
            color: #fff;
            box-shadow: 0 4px 12px rgba(91, 140, 255, 0.24);
        }

        .date-filter {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .date-filter input {
            padding: 8px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
        }

        .date-filter button,
        .pagination button {
            padding: 8px 16px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .order-item {
            display: flex;
            flex-direction: column;
            gap: 16px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 16px;
            transition: var(--transition);
            background-color: #fff;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .order-item:hover {
            background-color: var(--highlight-bg);
        }

        .field {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            align-items: center;
            gap: 12px;
        }

        .label {
            color: var(--secondary);
            font-weight: 500;
            flex-shrink: 0;
        }

        .value {
            color: var(--text-color);
            font-size: 14px;
            font-weight: 400;
            text-align: right;
            word-break: break-all;
        }

        .payment-amount {
            font-weight: 700;
            color: var(--primary);
        }

        .datetime {
            font-size: 12px;
            color: var(--text-color);
        }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .pagination input {
            width: 60px;
            padding: 6px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
        }

        .loading {
            text-align: center;
            font-size: 16px;
            color: var(--primary);
            padding: 20px;
        }

        @media (max-width: 768px) {
            .card {
                padding: 16px;
            }

            .field {
                font-size: 12px;
            }

            .payment-amount {
                font-size: 16px;
            }
        }

        @media (max-width: 600px) {
            .date-filter {
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
            }

            .date-filter input,
            .date-filter button {
                width: 100%;
            }

            .date-filter span {
                text-align: center;
            }
        }

        @media (max-width: 500px) {
            .pagination {
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
            }

            .pagination button,
            .pagination input,
            .pagination span {
                width: 100%;
                text-align: center;
            }

            .pagination input {
                max-width: 100%;
            }

            .total-amount {
                display: block;
                float: none;
                margin-top: 8px;
            }
        }

        /* V3: mobile workbench visual system */
        :root {
            --primary: #1677ff;
            --primary-soft: #eaf3ff;
            --success: #16803c;
            --success-soft: #eaf8ef;
            --warning: #b54708;
            --warning-soft: #fff4e5;
            --ink: #172033;
            --muted: #667085;
            --line: #e2e6ed;
            --surface: #ffffff;
            --page: #f5f7fa;
        }
        * { letter-spacing: 0; }
        body { display:block; background:var(--page); color:var(--ink); padding:0; min-height:100vh; }
        button,input { font:inherit; }
        .container { max-width:1180px; margin:0 auto; padding:18px 20px 40px; }
        .page-header { display:flex; justify-content:space-between; align-items:center; gap:16px; padding:4px 0 18px; }
        .page-title { font-size:22px; line-height:1.25; font-weight:750; margin:0; }
        .page-subtitle { color:var(--muted); font-size:13px; margin-top:5px; }
        .back-btn { width:38px; height:38px; border:1px solid var(--line); border-radius:6px; color:#344054; background:#fff; cursor:pointer; }
        .summary-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; margin-bottom:14px; }
        .summary-item { position:relative; min-height:106px; background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:17px 18px; overflow:hidden; }
        .summary-label { color:var(--muted); font-size:13px; }
        .summary-value { margin-top:10px; font-size:25px; line-height:1; font-weight:800; color:var(--ink); font-variant-numeric:tabular-nums; }
        .summary-value.primary { color:var(--primary); }.summary-value.success { color:var(--success); }
        .summary-value.textual { font-size:20px; color:#475467; }
        .summary-unit { font-size:13px; font-weight:600; margin-left:3px; color:inherit; }
        .summary-icon { position:absolute; right:16px; top:16px; width:32px; height:32px; border-radius:6px; display:grid; place-items:center; color:var(--primary); background:var(--primary-soft); }
        .summary-item:nth-child(2) .summary-icon { color:var(--success); background:var(--success-soft); }
        .summary-item:nth-child(3) .summary-icon { color:var(--warning); background:var(--warning-soft); }
        .workspace { background:var(--surface); border:1px solid var(--line); border-radius:8px; overflow:hidden; }
        .workspace-toolbar { display:flex; justify-content:space-between; align-items:center; gap:14px; padding:14px 16px; border-bottom:1px solid var(--line); }
        .order-type-tabs { margin:0; display:inline-flex; gap:0; border:1px solid #c9d1dd; border-radius:6px; overflow:hidden; flex-wrap:nowrap; }
        .tab-btn { height:36px; min-width:100px; padding:0 16px; border:0; border-radius:0; color:#475467; background:#fff; box-shadow:none; }
        .tab-btn + .tab-btn { border-left:1px solid #c9d1dd; }.tab-btn.active { background:var(--primary); color:#fff; box-shadow:none; }
        .range-text { color:var(--muted); font-size:12px; }
        .filter-panel { padding:14px 16px; background:#fafbfc; border-bottom:1px solid var(--line); }
        .quick-ranges { display:flex; gap:7px; margin-bottom:10px; flex-wrap:wrap; }
        .quick-btn { height:32px; padding:0 12px; color:#475467; background:#fff; border:1px solid #cfd6e1; border-radius:6px; cursor:pointer; }
        .quick-btn.active { color:var(--primary); border-color:#8bbcff; background:var(--primary-soft); }
        .date-filter { margin:0; display:grid; grid-template-columns:minmax(190px,1fr) 20px minmax(190px,1fr) auto; align-items:end; gap:9px; }
        .date-field label { display:block; color:var(--muted); font-size:12px; margin-bottom:5px; }
        .date-filter input { width:100%; height:38px; border:1px solid #cfd6e1; border-radius:6px; padding:0 10px; background:#fff; color:var(--ink); }
        .date-filter .to { align-self:center; text-align:center; color:#98a2b3; margin-top:18px; }
        .date-filter .filter-btn { height:38px; border-radius:6px; padding:0 18px; background:var(--primary); }
        .list-meta { display:flex; justify-content:space-between; align-items:center; padding:12px 16px 4px; color:var(--muted); font-size:12px; }
        #income-details { padding:8px 16px 2px; }
        .order-item { border:1px solid var(--line); border-radius:8px; padding:0; margin:0 0 10px; gap:0; overflow:hidden; box-shadow:none; }
        .order-item:hover { background:#fff; border-color:#b8d5ff; }
        .order-head { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; padding:13px 15px; background:#fbfcfe; border-bottom:1px solid #edf0f4; }
        .order-title { font-size:14px; font-weight:700; color:#344054; word-break:break-all; }
        .order-user { color:var(--muted); font-size:12px; margin-top:4px; }
        .order-amount { flex-shrink:0; text-align:right; color:var(--primary); font-size:19px; line-height:1.15; font-weight:800; font-variant-numeric:tabular-nums; }
        .order-amount small { display:block; color:var(--muted); font-size:11px; font-weight:500; margin-top:4px; }
        .order-body { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:0; padding:4px 15px 10px; }
        .field { display:block; padding:10px 12px 7px 0; min-width:0; }
        .field.wide { grid-column:span 2; }.field.full { grid-column:1/-1; }
        .label { color:#98a2b3; font-size:11px; font-weight:500; margin-bottom:3px; }
        .value { color:#344054; font-size:13px; font-weight:600; text-align:left; word-break:break-word; }
        .payment-amount { color:var(--success); font-size:14px; }.datetime { color:#475467; font-size:12px; }
        .status-tag { display:inline-flex; align-items:center; min-height:24px; padding:2px 8px; border-radius:5px; color:var(--success); background:var(--success-soft); font-size:12px; }
        .pagination { margin:6px 16px 16px; padding-top:12px; border-top:1px solid var(--line); flex-direction:row; align-items:center; gap:8px; }
        .pagination button { height:34px; padding:0 13px; border-radius:6px; background:#fff; color:#344054; border:1px solid #cfd6e1; }
        .pagination input { width:58px; height:34px; padding:0 8px; border-radius:6px; }
        .pagination .jump-label { color:var(--muted); font-size:12px; margin-left:auto; }
        .loading { margin:8px 16px 16px; border:1px dashed #cfd6e1; border-radius:7px; color:var(--muted); background:#fafbfc; font-size:13px; }
        @media(max-width:760px){
            .container{padding:14px 12px 28px}.page-header{padding-bottom:14px}.summary-grid{grid-template-columns:1fr 1fr}.summary-item{min-height:94px;padding:14px}.summary-item:first-child{grid-column:1/-1}.summary-value{font-size:23px}.workspace-toolbar{align-items:flex-start;flex-direction:column}.range-text{display:none}.date-filter{grid-template-columns:1fr 18px 1fr}.date-filter .filter-btn{grid-column:1/-1}.order-body{grid-template-columns:1fr 1fr}.field.wide{grid-column:span 1}.pagination{flex-wrap:wrap}.pagination .jump-label{margin-left:0}
        }
        @media(max-width:480px){
            .page-title{font-size:19px}.summary-grid{gap:8px}.summary-item{min-height:88px}.summary-icon{right:12px;top:12px}.date-filter{grid-template-columns:1fr}.date-filter .to{display:none}.order-head{padding:12px}.order-body{padding:3px 12px 8px}.field{padding-right:8px}.pagination span,.pagination input,.pagination button{width:auto}.pagination{justify-content:center}.pagination .jump-label,#jumpPage,.jump-btn{display:none}
        }
    </style>
</head>

<body>
    <div class="container">
        <header class="page-header">
            <div>
                <h1 class="page-title">收益明细</h1>
                <div class="page-subtitle">查看场地订单与收益构成</div>
            </div>
            <button class="back-btn" type="button" onclick="history.back()" title="返回">
                <i class="fas fa-arrow-left"></i>
            </button>
        </header>

        <section class="summary-grid">
            <div class="summary-item">
                <div class="summary-label" id="grossLabel">设备收入</div>
                <div class="summary-value primary" id="summaryGross">¥0.00</div>
                <span class="summary-icon"><i class="fas fa-coins"></i></span>
            </div>
            <div class="summary-item">
                <div class="summary-label" id="actualLabel">预估收益</div>
                <div class="summary-value success" id="summaryActual">¥0.00</div>
                <span class="summary-icon"><i class="fas fa-chart-line"></i></span>
            </div>
            <div class="summary-item">
                <div class="summary-label">订单数量</div>
                <div class="summary-value" id="summaryCount">0<span class="summary-unit">笔</span></div>
                <span class="summary-icon"><i class="fas fa-receipt"></i></span>
            </div>
        </section>

        <section class="workspace">
            <div class="workspace-toolbar">
                <div class="order-type-tabs">
                    <button id="deviceTab" class="tab-btn active" onclick="switchOrderType('device')">设备订单</button>
                    <button id="giftTab" class="tab-btn" onclick="switchOrderType('gift')">礼物订单</button>
                </div>
                <div class="range-text" id="rangeText">今日 00:00 - 23:59</div>
            </div>

            <div class="filter-panel">
                <div class="quick-ranges">
                    <button class="quick-btn active" type="button" onclick="setQuickRange('today', this)">今天</button>
                    <button class="quick-btn" type="button" onclick="setQuickRange('yesterday', this)">昨天</button>
                    <button class="quick-btn" type="button" onclick="setQuickRange('seven', this)">近7天</button>
                </div>
                <div class="date-filter">
                    <div class="date-field">
                        <label for="startDate">开始时间</label>
                        <input type="datetime-local" id="startDate" class="date-input">
                    </div>
                    <span class="to">至</span>
                    <div class="date-field">
                        <label for="endDate">结束时间</label>
                        <input type="datetime-local" id="endDate" class="date-input">
                    </div>
                    <button class="filter-btn" type="button" onclick="filterByDate(true)"><i class="fas fa-filter"></i> 筛选</button>
                </div>
            </div>

            <div class="list-meta">
                <span id="listTypeLabel">设备订单明细</span>
                <span id="listCount">共 0 笔</span>
            </div>
            <div id="income-details"></div>

            <div class="pagination">
                <button onclick="prevPage()" id="prevBtn">上一页</button>
                <span id="pageInfo"></span>
                <button onclick="nextPage()" id="nextBtn">下一页</button>
                <span class="jump-label">跳转至</span>
                <input id="jumpPage" type="number" min="1">
                <button class="jump-btn" onclick="goToPage()">跳转</button>
            </div>

            <div id="loading" class="loading" style="display: none;">正在加载...</div>
        </section>
    </div>

    <script>
        let currentPage = 1;
        const limit = 10;
        let startDate = '';
        let endDate = '';
        let totalPages = 1;
        let currentOrderType = 'device'; // 默认设备订单
        let currentRoleId = 0;

        document.addEventListener('DOMContentLoaded', function () {
            const now = new Date();
            const yyyy_mm_dd = getLocalYmd(now);

            document.getElementById('startDate').value = `${yyyy_mm_dd}T00:00`;
            document.getElementById('endDate').value = `${yyyy_mm_dd}T23:59`;

            startDate = `${yyyy_mm_dd} 00:00:00`;
            endDate = `${yyyy_mm_dd} 23:59:59`;

            updateRangeText();
            loadIncomeData(currentPage);
        });

        function getLocalYmd(date) {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, function (char) {
                return {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#039;'
                }[char];
            });
        }

        function formatDateTimeLocal(value) {
            if (!value) return '';
            return value.replace('T', ' ') + ':00';
        }

        function formatMoney(value) {
            const num = Number(value || 0);
            return num.toFixed(2);
        }

        function getActualArrivalHtml(order, orderType) {
            const roleId = Number(currentRoleId);
            const paymentAmount = Number(order.payment_amount || 0);

            // role_id=4：设备实付 × 80%；礼物金币 ÷ 10 × 60% × 80%。
            if (roleId === 4) {
                const actualAmount = orderType === 'gift'
                    ? (paymentAmount / 10) * 0.6 * 0.8
                    : paymentAmount * 0.8;

                return `
                    <div class="field">
                        <div class="label">实际到账金额</div>
                        <div class="value payment-amount">¥${formatMoney(actualAmount)}</div>
                    </div>
                `;
            }

            // 设备订单按 payment_amount - promotion_amount 展示预估收益。
            // promotion_amount 为 NULL 时按 0 处理，预估收益等于支付金额。
            if (orderType !== 'device') {
                return '';
            }

            const promotionAmount = Number(order.promotion_amount || 0);
            const actualAmount = order.actual_arrival_amount == null
                ? paymentAmount - promotionAmount
                : Number(order.actual_arrival_amount || 0);

            return `
                <div class="field">
                    <div class="label">预估收益</div>
                    <div class="value payment-amount">¥${formatMoney(actualAmount)}</div>
                </div>
            `;
        }

        function switchOrderType(type) {
            currentOrderType = type === 'gift' ? 'gift' : 'device';
            currentPage = 1;
            document.getElementById('jumpPage').value = '';

            document.getElementById('deviceTab').classList.toggle('active', currentOrderType === 'device');
            document.getElementById('giftTab').classList.toggle('active', currentOrderType === 'gift');
            document.getElementById('listTypeLabel').textContent = currentOrderType === 'gift' ? '礼物订单明细' : '设备订单明细';

            loadIncomeData(currentPage);
        }

        function buildApiUrl(page) {
            const params = new URLSearchParams({
                page: page,
                limit: limit,
                order_type: currentOrderType,
                order_number: '',
                start_time: startDate,
                end_time: endDate,
                exclude_energy: 'on',
                uid: ''
            });

            return `https://open.rcwulian.cn/api/venue/GetDrivingOrdersv2.php?${params.toString()}`;
        }

        function loadIncomeData(page) {
            const url = buildApiUrl(page);
            console.log('请求URL:', url);

            const loading = document.getElementById('loading');
            const incomeDetails = document.getElementById('income-details');

            loading.textContent = '正在加载...';
            loading.style.display = 'block';
            incomeDetails.innerHTML = '';

            fetch(url)
                .then(response => response.json())
                .then(data => {
                    if (data.code === 0) {
                        currentRoleId = Number(data.role_id || 0);
                        updateTotalAmount(data);

                        totalPages = Math.max(1, Math.ceil((Number(data.count) || 0) / limit));
                        updatePagination();

                        if (Array.isArray(data.data) && data.data.length > 0) {
                            if (currentOrderType === 'gift') {
                                displayGiftDetails(data.data);
                            } else {
                                displayDeviceDetails(data.data);
                            }
                            loading.style.display = 'none';
                        } else {
                            loading.textContent = '没有更多数据了';
                        }
                    } else {
                        loading.textContent = data.msg || '加载失败，请重试';
                    }
                })
                .catch(error => {
                    console.error('数据加载失败:', error);
                    loading.textContent = '加载失败，请重试';
                    setTimeout(() => loading.style.display = 'none', 2000);
                });
        }

        function updateTotalAmount(data) {
            const totalNum = Number(data.total_income || 0);
            const promotionTotal = Number(data.total_promotion_amount || 0);
            const actualTotalNum = data.total_actual_income == null
                ? totalNum - promotionTotal
                : Number(data.total_actual_income || 0);
            const count = Number(data.count || 0);
            const grossLabel = document.getElementById('grossLabel');
            const actualLabel = document.getElementById('actualLabel');
            const summaryActual = document.getElementById('summaryActual');

            document.getElementById('summaryGross').textContent = `¥${formatMoney(totalNum)}`;
            document.getElementById('summaryCount').innerHTML = `${count}<span class="summary-unit">笔</span>`;
            document.getElementById('listCount').textContent = `共 ${count} 笔`;
            document.getElementById('listTypeLabel').textContent = currentOrderType === 'gift' ? '礼物订单明细' : '设备订单明细';

            summaryActual.classList.remove('textual');
            if (currentOrderType === 'gift') {
                grossLabel.textContent = '累计礼物收益';
                if (Number(currentRoleId) === 4) {
                    actualLabel.textContent = '实际到账';
                    summaryActual.textContent = `¥${formatMoney(totalNum * 0.8)}`;
                } else {
                    actualLabel.textContent = '当前类型';
                    summaryActual.textContent = '礼物订单';
                    summaryActual.classList.add('textual');
                }
            } else if (Number(currentRoleId) === 4) {
                grossLabel.textContent = '累计设备收入';
                actualLabel.textContent = '实际到账';
                summaryActual.textContent = `¥${formatMoney(totalNum * 0.8)}`;
            } else {
                grossLabel.textContent = '累计设备收入';
                actualLabel.textContent = '预估收益';
                summaryActual.textContent = `¥${formatMoney(actualTotalNum)}`;
            }
        }

        function updatePagination() {
            const pageInfo = document.getElementById('pageInfo');
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');

            pageInfo.textContent = `第 ${currentPage} 页 / 共 ${totalPages} 页`;
            prevBtn.disabled = currentPage <= 1;
            nextBtn.disabled = currentPage >= totalPages;

            prevBtn.style.opacity = currentPage <= 1 ? '0.5' : '1';
            nextBtn.style.opacity = currentPage >= totalPages ? '0.5' : '1';
        }

        function prevPage() {
            if (currentPage > 1) {
                currentPage--;
                loadIncomeData(currentPage);
            }
        }

        function nextPage() {
            if (currentPage < totalPages) {
                currentPage++;
                loadIncomeData(currentPage);
            }
        }

        function updateRangeText() {
            const startInput = document.getElementById('startDate').value;
            const endInput = document.getElementById('endDate').value;
            if (!startInput || !endInput) return;

            const formatDisplay = value => value.replace('T', ' ');
            document.getElementById('rangeText').textContent = `${formatDisplay(startInput)} - ${formatDisplay(endInput)}`;
        }

        function setQuickRange(type, button) {
            const now = new Date();
            const start = new Date(now);
            const end = new Date(now);

            if (type === 'yesterday') {
                start.setDate(start.getDate() - 1);
                end.setDate(end.getDate() - 1);
            } else if (type === 'seven') {
                start.setDate(start.getDate() - 6);
            }

            const startYmd = getLocalYmd(start);
            const endYmd = getLocalYmd(end);
            document.getElementById('startDate').value = `${startYmd}T00:00`;
            document.getElementById('endDate').value = `${endYmd}T23:59`;
            document.querySelectorAll('.quick-btn').forEach(item => item.classList.remove('active'));
            if (button) button.classList.add('active');
            filterByDate(false);
        }

        function filterByDate(isManual = false) {
            const startInput = document.getElementById('startDate').value;
            const endInput = document.getElementById('endDate').value;

            if (startInput && endInput && startInput > endInput) {
                alert('开始日期不能大于结束日期');
                return;
            }

            startDate = formatDateTimeLocal(startInput);
            endDate = formatDateTimeLocal(endInput);
            updateRangeText();

            if (isManual) {
                document.querySelectorAll('.quick-btn').forEach(item => item.classList.remove('active'));
            }

            currentPage = 1;
            loadIncomeData(currentPage);
        }

        function displayDeviceDetails(orders) {
            const incomeDetailsContainer = document.getElementById('income-details');
            incomeDetailsContainer.innerHTML = '';

            orders.forEach(order => {
                const orderItem = document.createElement('div');
                orderItem.classList.add('order-item');

                const startTime = new Date(order.start_time);
                const endTime = new Date(order.end_time);
                const durationMs = endTime - startTime;
                const totalSeconds = Number.isFinite(durationMs) && durationMs > 0 ? Math.floor(durationMs / 1000) : 0;
                const minutes = Math.floor(totalSeconds / 60);
                const seconds = totalSeconds % 60;

                orderItem.innerHTML = `
                    <div class="order-head">
                        <div>
                            <div class="order-title">${escapeHtml(order.order_id)}</div>
                            <div class="order-user">用户 ${escapeHtml(order.uid)} · ${escapeHtml(order.nickname || '未设置昵称')}</div>
                        </div>
                        <div class="order-amount">¥${formatMoney(order.payment_amount)}<small>${escapeHtml(order.pays_type || '支付金额')}</small></div>
                    </div>
                    <div class="order-body">
                        <div class="field">
                            <div class="label">套餐时长</div>
                            <div class="value">${escapeHtml(order.billing_rules)} 分钟</div>
                        </div>
                        <div class="field">
                            <div class="label">实际驾驶</div>
                            <div class="value">${minutes} 分 ${seconds} 秒</div>
                        </div>
                        ${getActualArrivalHtml(order, 'device')}
                        <div class="field full">
                            <div class="label">驾驶时间</div>
                            <div class="value datetime">${escapeHtml(order.start_time)} - ${escapeHtml(order.end_time)}</div>
                        </div>
                    </div>
                `;
                incomeDetailsContainer.appendChild(orderItem);
            });
        }

        function displayGiftDetails(orders) {
            const incomeDetailsContainer = document.getElementById('income-details');
            incomeDetailsContainer.innerHTML = '';

            orders.forEach(order => {
                const orderItem = document.createElement('div');
                orderItem.classList.add('order-item');

                orderItem.innerHTML = `
                    <div class="order-head">
                        <div>
                            <div class="order-title">礼物订单 #${escapeHtml(order.id)}</div>
                            <div class="order-user">用户 ${escapeHtml(order.uid)} · ${escapeHtml(order.nickname || '未设置昵称')}</div>
                        </div>
                        <div class="order-amount">${formatMoney(order.payment_amount)}<small>${escapeHtml(order.pays_type || '金币')}</small></div>
                    </div>
                    <div class="order-body">
                        <div class="field">
                            <div class="label">礼物 ID</div>
                            <div class="value">${escapeHtml(order.gift_id)}</div>
                        </div>
                        <div class="field">
                            <div class="label">订单状态</div>
                            <div class="value"><span class="status-tag">${escapeHtml(order.status || '已完成')}</span></div>
                        </div>
                        ${getActualArrivalHtml(order, 'gift')}
                        <div class="field full">
                            <div class="label">送礼时间</div>
                            <div class="value datetime">${escapeHtml(order.send_time)}</div>
                        </div>
                    </div>
                `;
                incomeDetailsContainer.appendChild(orderItem);
            });
        }

        function goToPage() {
            const pageInput = document.getElementById('jumpPage').value;
            const pageNum = parseInt(pageInput, 10);

            if (!isNaN(pageNum) && pageNum >= 1 && pageNum <= totalPages) {
                currentPage = pageNum;
                loadIncomeData(currentPage);
            } else {
                alert(`请输入 1 到 ${totalPages} 之间的有效页码`);
            }
        }
    </script>
</body>

</html>
