<!DOCTYPE html> 
<html lang="zh-CN"> 
 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>修改设备配置</title> 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">   
    <style> 
        :root { 
            --primary: #5b8cff; 
            --secondary: #7f8fa4; 
            --background-gradient-start: #f8f9ff; 
            --background-gradient-end: #f0f3ff; 
            --card-bg: #ffffff; 
            --border-color: #ddd; 
            --text-color: #333; 
            --shadow: 0 4px 24px rgba(91, 140, 255, 0.08); 
            --transition: all 0.3s ease; 
        } 
 
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: "PingFang SC", system-ui; 
        } 
 
        body { 
            background: linear-gradient(135deg, var(--background-gradient-start) 0%, var(--background-gradient-end) 100%); 
            min-height: 100vh; 
            padding: 20px; 
            display: flex; 
            justify-content: center; 
            align-items: flex-start; 
        } 
 
        .container { 
            max-width: 680px; 
            width: 100%; 
        } 
 
        .card { 
            background: var(--card-bg); 
            border-radius: 12px; 
            padding: 20px; 
            box-shadow: var(--shadow); 
            margin-bottom: 20px; 
            transition: var(--transition); 
        } 
 
        .card-title { 
            font-size: 24px; 
            color: var(--text-color); 
            margin-bottom: 20px; 
            font-weight: 600; 
            border-bottom: 2px solid var(--primary); 
            padding-bottom: 10px; 
            text-align: center; 
        } 
 
        .form-field { 
            margin-bottom: 16px; 
            display: flex; 
            align-items: center; 
        } 
 
        .form-field label { 
            display: block; 
            font-size: 14px; 
            color: var(--secondary); 
            margin-bottom: 6px; 
            margin-right: 10px; 
            flex: 0 0 auto; 
        } 
 
        .form-field input[type="text"], 
        .form-field input[type="range"], 
        .form-field input[type="number"], 
        .form-field select { 
            padding: 10px; 
            font-size: 14px; 
            border: 1px solid var(--border-color); 
            border-radius: 6px; 
        } 
 
        .form-field input[type="range"] { 
            margin-right: 10px; 
            flex: 1; 
        } 
 
        /* 缩小输入框宽度 */ 
        .form-field input[type="number"] { 
            width: 80px; 
        } 
 
        .form-field select { 
            width: 100%; 
        } 
 
        .submit-btn { 
            background-color: var(--primary); 
            color: #fff; 
            padding: 12px; 
            border: none; 
            border-radius: 8px; 
            font-size: 16px; 
            cursor: pointer; 
            transition: var(--transition); 
            width: 120px; /* 设置按钮宽度 */ 
            margin-right: 10px; /* 添加右外边距，使按钮之间有间隔 */ 
        } 
 
        .submit-btn:hover { 
            background-color: #4a77e4; 
        } 
 
 
        .form-field.radio-group   { 
            display: flex; 
            align-items: center; 
        } 
 
        .form-field.radio-group   label { 
            display: inline-block; 
            margin-right: 10px; 
            margin-bottom: 0; 
        } 
 
        .form-field.radio-group   input[type="radio"] { 
            width: auto; 
            margin-right: 5px; 
        } 
        /* —— 通道行：大屏横排，小屏自动换行 —— */
.channel-row{
  display:flex;
  align-items:center;
  gap:16px;
  padding:6px 0;
  flex-wrap:wrap;       /* 空间不足时自动换行 */
  border-bottom: 1px dashed #eee;
}
.channel-label{
  width:60px;
  color:var(--secondary);
  flex:0 0 auto;
}
.channel-status{
  display:flex;
  align-items:center;
  gap:12px;
  flex:0 0 auto;
}
.channel-inputs{
  display:flex;
  align-items:center;
  gap:12px;
  flex:1 1 auto;        /* 占据剩余空间 */
  min-width:280px;      /* 保证三格不挤到一起 */
}
.channel-field{
  display:flex;
  align-items:center;
  gap:6px;
}
.channel-field span{
  width:28px;
  color:#7f8fa4;
}
/* 输入框宽度：在 72~120px 间随屏幕变化 */
.channel-field input[type="number"]{
  width: clamp(72px, 9vw, 120px);
}
/* 让“更新固件”按钮更小、更透气；在它下方留出分隔感 */
#fw-update-row {
  border-bottom: 1px dashed #eee;   /* 轻分隔线 */
  padding-bottom: 10px;             /* 分隔线内边距 */
  margin-bottom: 16px;              /* 与下面的表单留空 */
}

#btn-fw-update {
  width: auto;           /* 覆盖 .submit-btn 的 120px 固定宽 */
  padding: 8px 12px;     /* 更紧凑 */
  font-size: 14px;       /* 更小字 */
  border-radius: 6px;    /* 更小圆角 */
}
/* —— 小屏优化（≤640px）：上下堆叠更易点选 —— */
@media (max-width: 640px){
  .channel-row{ align-items:flex-start; }
  .channel-status{ order:2; }
  .channel-inputs{ order:3; width:100%; }
}
/* —— 通道里的数字输入：统一高度/圆角/阴影 —— */
.channel-field input[type="number"]{
  height: 36px;
  padding: 0 10px;
  border: 1px solid var(--border-color);
  border-radius: 8px;
  background: #fff;
  box-shadow: inset 0 1px 2px rgba(0,0,0,0.04);
  font-size: 14px;
  line-height: 36px;
  box-sizing: border-box;
  transition: border-color .2s ease, box-shadow .2s ease;
  /* 原来有宽度 clamp；保留： */
  width: clamp(72px, 9vw, 120px);
}

/* 聚焦时的主色高亮，与全局风格一致 */
.channel-field input[type="number"]:focus{
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(91,140,255,0.12);
}

/* 去掉数字输入的小箭头（各浏览器） */
.channel-field input[type="number"]::-webkit-outer-spin-button,
.channel-field input[type="number"]::-webkit-inner-spin-button{
  -webkit-appearance: none;
  margin: 0;
}
.channel-field input[type="number"]{
  -moz-appearance: textfield;
}

/* 标签对齐更紧凑一些 */
.channel-field span{
  width: auto;
  min-width: 28px;
  text-align: right;
  color:#7f8fa4;
}

/* 行间距稍紧，PC 不拥挤 */
.channel-inputs{ gap: 12px; }

@media (max-width: 640px){
  /* 手机上输入框可拉满，避免拥挤 */
  .channel-inputs{ gap: 10px; }
  .channel-field input[type="number"]{ width: 100%; }
}

/* ✅ 发射配置分组框 */
.shoot-group{
  border: 1px solid rgba(91,140,255,0.35);
  background: rgba(91,140,255,0.05);
  border-radius: 12px;
  padding: 12px 14px;
  margin: 14px 0 18px;
}

.shoot-group-title{
  font-size: 13px;
  color: var(--primary);
  font-weight: 600;
  margin: 0 0 10px;
  display:flex;
  align-items:center;
  gap:8px;
}

.shoot-group-title::before{
  content:"";
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--primary);
  display:inline-block;
}

/* 分组内部的 form-field 间距更紧凑一点 */
.shoot-group .form-field{ margin-bottom: 12px; }
.shoot-group .form-field:last-child{ margin-bottom: 0; }


/* ✅ 配置复制/粘贴分组：压缩高度，只允许相同 car_type 的配置粘贴保存 */
.copy-paste-group{
  border: 1px solid rgba(91,140,255,0.28);
  background: linear-gradient(180deg, rgba(91,140,255,0.055), rgba(91,140,255,0.025));
  border-radius: 14px;
  padding: 14px 16px;
  margin: 20px 0 18px;
}
.copy-paste-header{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:12px;
  margin-bottom:10px;
}
.copy-paste-title{
  font-size: 14px;
  color: var(--primary);
  font-weight: 700;
  line-height: 1.3;
}
.copy-paste-tip{
  font-size: 12px;
  color: #7f8fa4;
  line-height: 1.55;
  margin-top: 4px;
}
.copy-paste-badge{
  flex:0 0 auto;
  padding:4px 8px;
  border-radius:999px;
  background:#fff;
  border:1px solid rgba(91,140,255,0.25);
  color:var(--primary);
  font-size:12px;
  line-height:1;
  white-space:nowrap;
}
#config-paste-input{
  width: 100%;
  min-height: 74px;
  resize: vertical;
  padding: 10px 12px;
  border: 1px solid rgba(127,143,164,0.32);
  border-radius: 10px;
  font-size: 12px;
  line-height: 1.45;
  color: #333;
  background: #fff;
  outline: none;
}
#config-paste-input:focus{
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(91,140,255,0.12);
}
.copy-paste-actions{
  display: flex;
  justify-content:flex-end;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 10px;
}
.copy-paste-actions .submit-btn{
  width: auto;
  min-width: 112px;
  padding: 8px 12px;
  font-size: 14px;
  border-radius: 7px;
}
.copy-paste-status{
  margin-top: 8px;
  font-size: 12px;
  line-height: 1.45;
  color: #7f8fa4;
  word-break: break-all;
}
.copy-paste-status.ok{ color: #16a34a; }
.copy-paste-status.err{ color: #dc2626; }
@media (max-width: 640px){
  .container{ max-width: 100%; }
  .copy-paste-header{ display:block; }
  .copy-paste-badge{ display:inline-block; margin-top:8px; }
  .copy-paste-actions{ justify-content:stretch; }
  .copy-paste-actions .submit-btn{ flex: 1 1 100%; }
}

    </style> 
</head> 
 
<body>

        <div class="card"> 
            <div class="card-title">修改设备配置</div>

                </div>

                </div>

            <!-- ✅ 发射配置分组（默认隐藏，JS 控制显示） -->
<div class="shoot-group" id="shoot-group" style="display:none;">

</div>

                <div id="channel-switches" style="display: none;">
                    <div class="card-title" style="margin-top: 20px;">通道开关配置 (仅管理员)</div>
                    <div id="ch-toggle-fields">
                        <!-- 每个ch独立div，将由 JS 插入 -->
                    </div>
                     <!-- ✅ 新增：更新固件按钮（默认隐藏，JS按权限显示） -->
                  <div id="fw-update-row" style="display:none; margin-top:12px; text-align:center;">

<script>
const channels = ['ch1','ch2','ch3','ch4','ch5','ch6'];
let CURRENT_ROLE_ID = null;   // 保存当前用户角色
let DEVICE_DATA = null;       // 保存设备配置
const isPlatformAdmin = () => (Number(CURRENT_ROLE_ID) === 1 || Number(CURRENT_ROLE_ID) === 2);
const isSiteRole = () => [3, 4].includes(Number(CURRENT_ROLE_ID));

// ✅ 只记录用户真正动过的字段；页面回填时不算修改
let IS_FILLING = false;
const DIRTY_FIELDS = new Set();

function markDirty(field) {
  if (!IS_FILLING && field) DIRTY_FIELDS.add(field);
}

function sameValue(a, b) {
  return String(a ?? '') === String(b ?? '');
}

function getCheckedValue(name) {
  const el = document.querySelector(`input[name="${name}"]:checked`);
  return el ? el.value : '';
}

// 兼容你现在的历史反向映射：页面 true/false 与 DB true/false 是反着存的
function uiBoolToDbBool(v) {
  return v === 'true' ? 'false' : 'true';
}

function addChanged(data, key, newValue, oldValue) {
  if (!DIRTY_FIELDS.has(key)) return;
  if (!sameValue(newValue, oldValue)) data[key] = newValue;
}

/** 工具：从 "ch1#1000-2000#false#1500" 解析 */
function parseChannel(raw) {
  if (!raw || typeof raw !== 'string') {
    return { label: '', min: 1000, max: 2000, mid: 1500, status: 'false' };
  }
  const parts = raw.split('#');
  const label = parts[0] || '';
  const range = (parts[1] || '1000-2000').split('-');
  const min = Number(range[0]) || 1000;
  const max = Number(range[1]) || 2000;
  const status = (parts[2] === 'true') ? 'true' : 'false';
  const mid = Number(parts[3]) || 1500;
  return { label, min, max, mid, status };
}
function buildChannelString(info) {
  const label = info.label || 'ch';
  const min = Math.round(info.min);
  const max = Math.round(info.max);
  const mid = Math.round(info.mid);
  const status = (info.status === 'true') ? 'true' : 'false';
  return `${label}#${min}-${max}#${status}#${mid}`;
}

/* 映射函数 */
function mapThrottleMaxToRange(v){ return ((v-1500)/500)*100; }
function mapThrottleMaxFromRange(v){ return (v/100)*500+1500; }
function mapThrottleMinToRange(v){ return ((v-1000)/500)*100; }
function mapThrottleMinFromRange(v){ return (v/100)*500+1000; }
function mapToRange(v){ return ((v-1000)/1000)*100; }
function mapFromRange(v){ return (v/100)*1000+1000; }
function mapThrottleMidToRange(v){ return ((v-1000)/1000)*100; }
function mapThrottleMidFromRange(v){ return (v/100)*1000+1000; }

const BASE_NUMERIC_LIMITS = {
  throttle_max:  { min: 1500, max: 2000, toRange: mapThrottleMaxToRange,  fromRange: mapThrottleMaxFromRange  },
  direction_mid: { min: 1000, max: 2000, toRange: mapToRange,             fromRange: mapFromRange             },
  throttle_mid:  { min: 1000, max: 2000, toRange: mapThrottleMidToRange,  fromRange: mapThrottleMidFromRange  },
  throttle_min:  { min: 1000, max: 1500, toRange: mapThrottleMinToRange,  fromRange: mapThrottleMinFromRange  }
};
const BASE_NUMERIC_LABELS = {
  throttle_max: '油门最大值',
  direction_mid: '方向中位值',
  throttle_mid: '油门中位值',
  throttle_min: '油门最小值'
};

function clampBaseNumber(id, value) {
  const rule = BASE_NUMERIC_LIMITS[id];
  let n = Number(value);
  if (!Number.isFinite(n)) n = Number(rule?.min || 0);
  n = Math.round(n);
  if (!rule) return n;
  return Math.max(rule.min, Math.min(rule.max, n));
}

function setBaseNumberValue(id, value, shouldMarkDirty = true) {
  const rule = BASE_NUMERIC_LIMITS[id];
  const input = document.getElementById(id);
  const range = document.getElementById(`${id}_range`);
  if (!rule || !input) return;

  const n = clampBaseNumber(id, value);
  input.value = n;
  if (range) range.value = rule.toRange(n);
  if (shouldMarkDirty) markDirty(id);
}

function syncBaseNumberFromInput(id, clampNow = false) {
  const rule = BASE_NUMERIC_LIMITS[id];
  const input = document.getElementById(id);
  const range = document.getElementById(`${id}_range`);
  if (!rule || !input) return;

  const raw = String(input.value || '').trim();
  if (raw === '') {
    if (clampNow) {
      input.value = rule.min;
      if (range) range.value = rule.toRange(rule.min);
    }
    markDirty(id);
    return;
  }

  let n = Number(raw);
  if (!Number.isFinite(n)) return;
  n = Math.round(n);

  if (clampNow) {
    n = clampBaseNumber(id, n);
    input.value = n;
  } else if (n < rule.min || n > rule.max) {
    // 正在输入时不强行打断；失焦/保存前会自动压回边界值。
    markDirty(id);
    return;
  }

  if (range) range.value = rule.toRange(n);
  markDirty(id);
}

function normalizeBaseNumericInputs() {
  Object.keys(BASE_NUMERIC_LIMITS).forEach(id => syncBaseNumberFromInput(id, true));
}

// ✅ 配置复制/粘贴：复制出来的文本带 car_type，粘贴保存前前端校验，后端也会二次校验
const CONFIG_COPY_TYPE = 'rc_vehicle_control_settings';
const CONFIG_COPY_VERSION = 1;
const carTypeNameMap = {
  1: '汽车',
  2: '坦克',
  3: '挖掘机',
  4: '推土机',
  5: '翻斗车',
  6: '娃娃机',
  7: '液压推土机',
  8: '液压自卸车',
  9: '液压挖掘机'
};

function getCarTypeName(v) {
  const n = Number(v || 0);
  return carTypeNameMap[n] ? `${carTypeNameMap[n]}(${n})` : `未知(${n || '-'})`;
}

function setPasteStatus(text, type = '') {
  const el = document.getElementById('config-paste-status');
  if (!el) return;
  el.className = 'copy-paste-status' + (type ? ` ${type}` : '');
  el.textContent = text || '';
}

function getNumberFromEl(id, fallback) {
  const el = document.getElementById(id);
  const raw = el ? el.value : '';
  if (raw === '' || raw === null || raw === undefined) {
    return BASE_NUMERIC_LIMITS[id] ? clampBaseNumber(id, fallback) : Number(fallback || 0);
  }
  const n = Number(raw);
  if (!Number.isFinite(n)) {
    return BASE_NUMERIC_LIMITS[id] ? clampBaseNumber(id, fallback) : Number(fallback || 0);
  }
  return BASE_NUMERIC_LIMITS[id] ? clampBaseNumber(id, n) : Math.round(n);
}

function getValueFromEl(id, fallback) {
  const el = document.getElementById(id);
  if (!el) return fallback;
  return el.value === undefined || el.value === null ? fallback : el.value;
}

function getDbBoolFromRadio(name, fallback) {
  const checked = getCheckedValue(name);
  if (!checked) return fallback;
  return uiBoolToDbBool(checked);
}

function buildCurrentChannelRaw(ch) {
  const oldInfo = parseChannel(DEVICE_DATA?.[ch]);
  const statusEl = document.querySelector(`input[name="${ch}_status"]:checked`);
  const status = statusEl ? statusEl.value : oldInfo.status;
  const max = getNumberFromEl(`${ch}_max`, oldInfo.max);
  const min = getNumberFromEl(`${ch}_min`, oldInfo.min);
  const mid = getNumberFromEl(`${ch}_mid`, oldInfo.mid);

  return buildChannelString({
    label: oldInfo.label || ch,
    min,
    max,
    mid,
    status
  });
}

function collectCurrentFormConfigSnapshot() {
  if (!DEVICE_DATA) throw new Error('设备配置还没有加载完成');
  normalizeBaseNumericInputs();

  const cfg = {
    // 复制出来的 car_type 固定使用数据库加载值，避免未保存的车辆类型选择伪装成其他类型。
    car_type: Number(DEVICE_DATA.car_type || 0),
    direction_mid: getNumberFromEl('direction_mid', DEVICE_DATA.direction_mid),
    throttle_mid: getNumberFromEl('throttle_mid', DEVICE_DATA.throttle_mid || 1500),
    driver_type: Number(getValueFromEl('driver_type', DEVICE_DATA.driver_type || 0)),
    throttle_max: getNumberFromEl('throttle_max', DEVICE_DATA.throttle_max),
    throttle_min: getNumberFromEl('throttle_min', DEVICE_DATA.throttle_min),
    direction: getDbBoolFromRadio('direction', DEVICE_DATA.direction),
    throttle: getDbBoolFromRadio('throttle', DEVICE_DATA.throttle),
    is_display: Number(getCheckedValue('is_display') || DEVICE_DATA.is_display || 0),
    cooldown: getNumberFromEl('cooldown', DEVICE_DATA.cooldown || 100),
    bullet_channel: String(getValueFromEl('bullet_channel', DEVICE_DATA.bullet_channel || 'C1')).toUpperCase(),
    audio_source_type: Number(getValueFromEl('audio_source_type', DEVICE_DATA.audio_source_type || 0)),
    is_show_achievements: Number(getCheckedValue('is_show_achievements') || DEVICE_DATA.is_show_achievements || 0)
  };

  channels.forEach(ch => {
    cfg[ch] = buildCurrentChannelRaw(ch);
  });

  return cfg;
}

function buildCopyPayload() {
  const cfg = collectCurrentFormConfigSnapshot();
  const serialNumber = document.getElementById('device_id').value || '';

  return {
    type: CONFIG_COPY_TYPE,
    version: CONFIG_COPY_VERSION,
    copied_at: new Date().toISOString(),
    source_serial_number: serialNumber,
    source_name: document.getElementById('name').value || '',
    car_type: Number(cfg.car_type || 0),
    car_type_name: getCarTypeName(cfg.car_type),
    config: cfg
  };
}

function cleanPastedConfigText(text) {
  let raw = String(text || '').trim();
  if (raw.startsWith('```')) {
    raw = raw.replace(/^```(?:json)?\s*/i, '').replace(/```$/i, '').trim();
  }
  return raw;
}

function validateChannelRaw(ch, raw) {
  if (typeof raw !== 'string') return false;
  const reg = new RegExp(`^${ch}#\\d{3,4}-\\d{3,4}#(?:true|false)#\\d{3,4}$`, 'i');
  return reg.test(raw.trim());
}

function parsePastedConfigText(text) {
  const raw = cleanPastedConfigText(text);
  if (!raw) throw new Error('请先粘贴配置文本');

  let payload;
  try {
    payload = JSON.parse(raw);
  } catch (e) {
    throw new Error('配置文本不是合法 JSON，请使用“复制当前配置”生成的文本');
  }

  if (!payload || payload.type !== CONFIG_COPY_TYPE || !payload.config || typeof payload.config !== 'object') {
    throw new Error('配置格式不正确：不是本页面复制出来的设备配置');
  }

  const sourceCarType = Number(payload.car_type || payload.config.car_type || 0);
  const currentCarType = Number(DEVICE_DATA?.car_type || 0);

  if (!sourceCarType) {
    throw new Error('配置缺少 car_type，已拦截');
  }

  if (sourceCarType !== currentCarType) {
    throw new Error(`car_type 不一致，已拦截：配置=${getCarTypeName(sourceCarType)}，当前设备=${getCarTypeName(currentCarType)}`);
  }

  if (payload.config.car_type !== undefined && Number(payload.config.car_type) !== sourceCarType) {
    throw new Error('配置内部 car_type 与外层 car_type 不一致，已拦截');
  }

  Object.keys(BASE_NUMERIC_LIMITS).forEach(field => {
    if (payload.config[field] === undefined || payload.config[field] === null || payload.config[field] === '') return;
    const rule = BASE_NUMERIC_LIMITS[field];
    const n = Number(payload.config[field]);
    if (!Number.isFinite(n) || n < rule.min || n > rule.max) {
      throw new Error(`${BASE_NUMERIC_LABELS[field] || field} 超出允许范围 ${rule.min}-${rule.max}，已拦截`);
    }
  });

  channels.forEach(ch => {
    if (payload.config[ch] !== undefined && !validateChannelRaw(ch, payload.config[ch])) {
      throw new Error(`${ch.toUpperCase()} 格式不正确，已拦截`);
    }
  });

  return { payload, sourceCarType, currentCarType };
}

function previewPastedConfig() {
  const input = document.getElementById('config-paste-input');
  if (!input || !input.value.trim()) {
    setPasteStatus('');
    return null;
  }

  try {
    const parsed = parsePastedConfigText(input.value);
    const from = parsed.payload.source_serial_number ? `来源设备：${parsed.payload.source_serial_number}，` : '';
    setPasteStatus(`${from}car_type 校验通过：${getCarTypeName(parsed.sourceCarType)}，可以粘贴保存。`, 'ok');
    return parsed;
  } catch (e) {
    setPasteStatus(e.message || '配置校验失败', 'err');
    return null;
  }
}

function addPasteChanged(data, key, newValue, oldValue) {
  if (newValue === undefined || newValue === null || newValue === '') return;
  if (!sameValue(newValue, oldValue)) data[key] = newValue;
}

function addPasteNumberChanged(data, key, rawValue, oldValue) {
  if (rawValue === undefined || rawValue === null || rawValue === '') return;
  const n = Number(rawValue);
  if (!Number.isFinite(n)) return;
  addPasteChanged(data, key, Math.round(n), oldValue);
}

function normalizeBoolString(v, fallback) {
  if (v === 'true' || v === true) return 'true';
  if (v === 'false' || v === false) return 'false';
  return fallback;
}

function buildPasteSaveData(parsed) {
  const cfg = parsed.payload.config || {};
  const data = {
    action: 'save',
    device_id: document.getElementById('device_id').value,
    paste_config: 1,
    paste_source_car_type: parsed.sourceCarType,
    paste_source_serial_number: String(parsed.payload.source_serial_number || '').slice(0, 64),
    paste_version: Number(parsed.payload.version || CONFIG_COPY_VERSION)
  };

  // 粘贴配置不允许改当前设备 car_type，只拿 car_type 做校验。
  addPasteNumberChanged(data, 'direction_mid', cfg.direction_mid, DEVICE_DATA.direction_mid);
  addPasteNumberChanged(data, 'throttle_mid', cfg.throttle_mid, DEVICE_DATA.throttle_mid);
  addPasteNumberChanged(data, 'throttle_max', cfg.throttle_max, DEVICE_DATA.throttle_max);
  addPasteNumberChanged(data, 'throttle_min', cfg.throttle_min, DEVICE_DATA.throttle_min);
  if (cfg.direction !== undefined) addPasteChanged(data, 'direction', normalizeBoolString(cfg.direction, DEVICE_DATA.direction), DEVICE_DATA.direction);
  if (cfg.throttle !== undefined) addPasteChanged(data, 'throttle', normalizeBoolString(cfg.throttle, DEVICE_DATA.throttle), DEVICE_DATA.throttle);

  if (isPlatformAdmin()) {
    addPasteNumberChanged(data, 'driver_type', cfg.driver_type, DEVICE_DATA.driver_type);
    if (cfg.audio_source_type !== undefined) {
      addPasteChanged(data, 'audio_source_type', Number(cfg.audio_source_type) === 1 ? 1 : 0, DEVICE_DATA.audio_source_type);
    }
    if (cfg.is_show_achievements !== undefined) {
      addPasteChanged(data, 'is_show_achievements', Number(cfg.is_show_achievements) === 1 ? 1 : 0, DEVICE_DATA.is_show_achievements);
    }
  }

  if (isPlatformAdmin() || isSiteRole()) {
    if (cfg.is_display !== undefined) {
      addPasteChanged(data, 'is_display', Number(cfg.is_display) === 1 ? 1 : 0, DEVICE_DATA.is_display);
    }
    addPasteNumberChanged(data, 'cooldown', cfg.cooldown, DEVICE_DATA.cooldown);
    const bullet = String(cfg.bullet_channel || '').toUpperCase();
    if (/^C[1-6]$/.test(bullet)) {
      addPasteChanged(data, 'bullet_channel', bullet, DEVICE_DATA.bullet_channel);
    }
  }

  const canSubmitChannels = (() => {
    const oldCarType = Number(DEVICE_DATA?.car_type || 0);
    return isPlatformAdmin() || (isSiteRole() && (oldCarType === 7 || oldCarType === 9));
  })();

  if (canSubmitChannels) {
    channels.forEach(ch => {
      if (cfg[ch] === undefined) return;

      const oldInfo = parseChannel(DEVICE_DATA[ch]);
      const pastedInfo = parseChannel(String(cfg[ch]));

      const newInfo = {
        label: oldInfo.label || ch,
        min: pastedInfo.min,
        max: pastedInfo.max,
        mid: pastedInfo.mid,
        status: pastedInfo.status
      };

      if (newInfo.status !== oldInfo.status) data[`${ch}_status`] = newInfo.status;
      if (String(Number(newInfo.max)) !== String(Number(oldInfo.max))) data[`${ch}_max`] = newInfo.max;
      if (String(Number(newInfo.min)) !== String(Number(oldInfo.min))) data[`${ch}_min`] = newInfo.min;
      if (String(Number(newInfo.mid)) !== String(Number(oldInfo.mid))) data[`${ch}_mid`] = newInfo.mid;
    });
  }

  return data;
}

async function copyCurrentConfig() {
  if (!isPlatformAdmin()) {
    alert('无权限使用配置复制/粘贴');
    return;
  }

  if (!DEVICE_DATA) {
    alert('设备配置还没有加载完成');
    return;
  }

  const input = document.getElementById('config-paste-input');
  const payload = buildCopyPayload();
  const text = JSON.stringify(payload, null, 2);
  if (input) input.value = text;

  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      setPasteStatus(`已复制当前配置：${getCarTypeName(payload.car_type)}。只能粘贴到相同 car_type 的设备。`, 'ok');
    } else {
      setPasteStatus('当前浏览器不允许自动写入剪贴板，配置已生成到输入框，请手动复制。', 'ok');
    }
  } catch (e) {
    setPasteStatus('配置已生成到输入框，但浏览器拦截了自动复制，请手动复制。', 'ok');
  }
}

async function pasteAndSaveConfig() {
  if (!isPlatformAdmin()) {
    alert('无权限使用配置复制/粘贴');
    return;
  }

  if (!DEVICE_DATA) {
    alert('设备配置还没有加载完成');
    return;
  }

  const parsed = previewPastedConfig();
  if (!parsed) return;

  const data = buildPasteSaveData(parsed);
  const metaKeys = ['action', 'device_id', 'paste_config', 'paste_source_car_type', 'paste_source_serial_number', 'paste_version'];
  const changedKeys = Object.keys(data).filter(k => !metaKeys.includes(k));

  if (!changedKeys.length) {
    setPasteStatus('粘贴配置和当前设备配置一致，没有需要保存的字段。', 'ok');
    return;
  }

  const fromText = parsed.payload.source_serial_number ? `来源设备 ${parsed.payload.source_serial_number}` : '粘贴配置';
  if (!confirm(`${fromText} 的配置将写入当前设备。\n已校验 car_type：${getCarTypeName(parsed.sourceCarType)}。\n本次将提交 ${changedKeys.length} 个字段，确认保存吗？`)) {
    return;
  }

  const btn = document.getElementById('paste-save-btn');
  if (btn) {
    btn.disabled = true;
    btn.innerText = '保存中...';
  }

  try {
    const resp = await fetch('https://open.rcwulian.cn/api/vehicle/modifDevicecfg_safe_transaction.php', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(data)
    });
    const result = await resp.json();
    if (result.code === 200) {
      alert(`粘贴保存成功，实际变更 ${result?.data?.changed_count ?? changedKeys.length} 项`);
      localStorage.removeItem('deviceData');
      location.reload();
    } else {
      setPasteStatus('粘贴保存失败：' + (result.msg || '未知错误'), 'err');
      alert('粘贴保存失败：' + (result.msg || '未知错误'));
    }
  } catch(e) {
    console.error('粘贴保存失败:', e);
    setPasteStatus('粘贴保存失败：网络或服务异常', 'err');
    alert('粘贴保存失败，请重试');
  } finally {
    if (btn) {
      btn.disabled = false;
      btn.innerText = '粘贴并保存';
    }
  }
}

const copyConfigBtn = document.getElementById('copy-config-btn');
if (copyConfigBtn) copyConfigBtn.addEventListener('click', copyCurrentConfig);

const pasteSaveBtn = document.getElementById('paste-save-btn');
if (pasteSaveBtn) pasteSaveBtn.addEventListener('click', pasteAndSaveConfig);

const configPasteInput = document.getElementById('config-paste-input');
if (configPasteInput) configPasteInput.addEventListener('input', previewPastedConfig);

/** 页面加载：先取用户，再拉设备，再按规则显示 */
/** 页面加载：先取用户，再拉设备，再按规则显示 */
window.addEventListener('DOMContentLoaded',  async function () {
  // 1) 获取当前用户角色
  try {
    const res = await fetch('https://open.rcwulian.cn/api/operat/get_current_user.php', { credentials: 'include' });
    const user = await res.json();
    if (user?.code === 0 && user?.data?.role_id) {
      CURRENT_ROLE_ID = Number(user.data.role_id);
    }
  } catch (err) {
    console.warn('获取用户信息失败:', err);
  }

  // 2) URL 参数
  const urlParams = new URLSearchParams(window.location.search);
  const device = {};
  urlParams.forEach((v, k) => device[k] = v);
  if (!Object.keys(device).length) { alert('未获取到设备序列号'); return; }
  document.getElementById('name').value = device.name;
  document.getElementById('device_id').value = device.serial_number;

  // 3) 拉取设备配置
  try {
    const resp = await fetch('https://open.rcwulian.cn/api/vehicle/modifDevicecfg.php', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          action: 'get',
          device_id: device.serial_number
        })
    });
    const result = await resp.json();
    if (result.code !== 200) { alert('获取设备配置信息失败：' + result.msg); return; }

    DEVICE_DATA = result.data;
    IS_FILLING = true;

    // 渲染 CH1~CH6（先渲染，再决定显示逻辑）
    renderChannels(DEVICE_DATA);

    // 其他字段回填
    document.getElementById('car_type').value = DEVICE_DATA.car_type;
    const audioSourceEl = document.getElementById('audio_source_type');
    if (audioSourceEl) {
      audioSourceEl.value = String(DEVICE_DATA.audio_source_type ?? 0) === '1' ? '1' : '0';
    }
    const achievementTrueEl = document.getElementById('is_show_achievements_true');
    const achievementFalseEl = document.getElementById('is_show_achievements_false');
    
    if (achievementTrueEl && achievementFalseEl) {
      const isShowAchievements = Number(DEVICE_DATA.is_show_achievements || 0) === 1;
      achievementTrueEl.checked = isShowAchievements;
      achievementFalseEl.checked = !isShowAchievements;
    }
    setBaseNumberValue('direction_mid', DEVICE_DATA.direction_mid, false);
    setBaseNumberValue('throttle_mid', DEVICE_DATA.throttle_mid || 1500, false);

    document.getElementById('driver_type').value = DEVICE_DATA.driver_type;
    setBaseNumberValue('throttle_max', DEVICE_DATA.throttle_max, false);
    setBaseNumberValue('throttle_min', DEVICE_DATA.throttle_min, false);

    document.querySelector(`input[name="direction"][value="${DEVICE_DATA.direction==='true'?'false':'true'}"]`).checked = true;
    document.querySelector(`input[name="throttle"][value="${DEVICE_DATA.throttle==='true'?'false':'true'}"]`).checked = true;

    const cooldownDisplay = (DEVICE_DATA.cooldown === null || DEVICE_DATA.cooldown === undefined || DEVICE_DATA.cooldown === '') ? 100 : DEVICE_DATA.cooldown;
    document.getElementById('cooldown_range').value = cooldownDisplay;
    document.getElementById('cooldown').value       = cooldownDisplay;
    document.getElementById('bullet_channel').value = DEVICE_DATA.bullet_channel || 'C1';
document.getElementById('is_display_true').checked  = Number(DEVICE_DATA.is_display) === 1;
document.getElementById('is_display_false').checked = Number(DEVICE_DATA.is_display) === 0;

    // 4) 按角色 + 车种 刷新可见性
    refreshChannelVisibility();
    IS_FILLING = false;
    DIRTY_FIELDS.clear();

    // （可选）绑定“更新固件”占位逻辑
// （替换你现在的“更新固件”按钮占位逻辑）
const btnFW = document.getElementById('btn-fw-update');
if (btnFW) {
  btnFW.addEventListener('click', async () => {
    try {
      // serial_number 就是你页面里 device_id（你已经塞进隐藏 input 了）
      const serial_number = document.getElementById('device_id').value;
      if (!serial_number) { alert('缺少设备序列号'); return; }

      btnFW.disabled = true;
      btnFW.innerText = '下发中...';

      const resp = await fetch('https://open.rcwulian.cn/api/vehicle/firmware_update.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ serial_number })
      });

      const result = await resp.json();
      if (result.code === 200) {
        alert('固件更新指令已下发：' + (result.msg || 'OK'));
      } else {
        alert('下发失败：' + (result.msg || 'unknown'));
      }
    } catch (e) {
      console.error(e);
      alert('下发失败：网络或服务异常');
    } finally {
      btnFW.disabled = false;
      btnFW.innerText = '更新固件';
    }
  });
}
  } catch(e) {   // ←← 这里能顺利匹配到上面的 try 了
    IS_FILLING = false;
    console.error('获取设备配置信息失败:', e);
    alert('获取设备配置信息失败，请重试');
  }
});


/** 表单提交 */
document.getElementById('modify-form').addEventListener('submit', async function (e) {
  e.preventDefault();
        if (!DEVICE_DATA) {
          alert('设备配置还没有加载完成');
          return;
        }

        normalizeBaseNumericInputs();

        const data = {
          action: 'save',
          device_id: document.getElementById('device_id').value
        };

        // ✅ 基础驾驶参数：role=1/2/3/4 都可输入；只有用户动过，并且和 DEVICE_DATA 不一致时才提交
        // ✅ 车辆类型 car_type 只允许平台管理员 role=1/2 修改，role=3/4 页面隐藏且不提交。
        if (isPlatformAdmin()) {
          addChanged(data, 'car_type', document.getElementById('car_type').value, DEVICE_DATA.car_type);
        }
        addChanged(data, 'direction_mid',  document.getElementById('direction_mid').value,  DEVICE_DATA.direction_mid);
        addChanged(data, 'throttle_mid',   document.getElementById('throttle_mid').value,   DEVICE_DATA.throttle_mid);
        addChanged(data, 'throttle_max',   document.getElementById('throttle_max').value,   DEVICE_DATA.throttle_max);
        addChanged(data, 'throttle_min',   document.getElementById('throttle_min').value,   DEVICE_DATA.throttle_min);
        addChanged(data, 'direction',      uiBoolToDbBool(getCheckedValue('direction')),    DEVICE_DATA.direction);
        addChanged(data, 'throttle',       uiBoolToDbBool(getCheckedValue('throttle')),     DEVICE_DATA.throttle);

        // ✅ 管理员字段
        if (isPlatformAdmin()) {
          addChanged(data, 'driver_type',          document.getElementById('driver_type').value,          DEVICE_DATA.driver_type);
          addChanged(data, 'audio_source_type',    document.getElementById('audio_source_type').value,    DEVICE_DATA.audio_source_type);
          addChanged(data, 'is_show_achievements', getCheckedValue('is_show_achievements'),              DEVICE_DATA.is_show_achievements);
        }

        // ✅ 发射配置：管理员 / role=3/4 才提交
        if (isPlatformAdmin() || isSiteRole()) {
          addChanged(data, 'is_display',     getCheckedValue('is_display'),                    DEVICE_DATA.is_display);
          addChanged(data, 'cooldown',       document.getElementById('cooldown').value,          DEVICE_DATA.cooldown);
          addChanged(data, 'bullet_channel', document.getElementById('bullet_channel').value,    DEVICE_DATA.bullet_channel);
        }
        
        // ✅ 通道配置：只提交真正变化的 CH 字段
        const canSubmitChannels = (() => {
          const oldCarType = Number(DEVICE_DATA?.car_type || 0);
          return isPlatformAdmin() || (isSiteRole() && (oldCarType === 7 || oldCarType === 9));
        })();
        
        if (canSubmitChannels) {
          channels.forEach(ch => {
            const oldInfo = parseChannel(DEVICE_DATA[ch]);
            const statusEl = document.querySelector(`input[name="${ch}_status"]:checked`);
            if (!statusEl) return;

            const statusKey = `${ch}_status`;
            if (DIRTY_FIELDS.has(statusKey) && statusEl.value !== oldInfo.status) {
              data[statusKey] = statusEl.value;
            }

            // 当前通道启用时，才允许提交数值
            if (statusEl.value === 'true') {
              ['max', 'min', 'mid'].forEach(part => {
                const key = `${ch}_${part}`;
                const el = document.getElementById(key);
                if (!el || !DIRTY_FIELDS.has(key)) return;

                const newValue = String(Number(el.value));
                const oldValue = String(Number(oldInfo[part]));
                if (newValue !== oldValue) data[key] = el.value;
              });
            }
          });
        }

        if (Object.keys(data).length <= 2) {
          alert('没有检测到需要保存的修改');
          return;
        }


  try {
    const resp = await fetch('https://open.rcwulian.cn/api/vehicle/modifDevicecfg_safe_transaction.php', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(data)
    });
    const result = await resp.json();
    if (result.code === 200) {
      alert('设备信息修改成功');
      localStorage.removeItem('deviceData');
      if (document.referrer) { location.href=document.referrer; } else { history.back(); }
    } else {
      alert('修改失败：' + result.msg);
    }
  } catch(e) {
    console.error('修改设备信息失败:', e);
    alert('修改设备信息失败，请重试');
  }
});
