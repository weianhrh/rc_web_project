<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>场地数据分析</title>
  <link rel="stylesheet" href="/res/fa/css/all.min.css">
  <style>
    :root{--blue:#1677ff;--green:#16803c;--amber:#b54708;--red:#c4320a;--ink:#172033;--muted:#667085;--line:#e2e6ed;--page:#f5f7fa;--surface:#fff;--blue-soft:#edf5ff;--green-soft:#eaf8ef;--amber-soft:#fff5e8;--red-soft:#fff0ed}
    *{box-sizing:border-box;letter-spacing:0}body{margin:0;background:var(--page);color:var(--ink);font:14px/1.5 Arial,"Microsoft YaHei",sans-serif}button,input{font:inherit}
    .shell{max-width:1240px;margin:0 auto;padding:20px 18px 42px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:16px}.title-wrap{min-width:0}.title-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}h1{font-size:22px;line-height:1.25;margin:0}.venue-badge{display:inline-flex;align-items:center;min-height:26px;padding:2px 9px;border-radius:5px;background:var(--blue-soft);color:var(--blue);font-size:12px;font-weight:700}.subtitle{color:var(--muted);font-size:13px;margin-top:5px}.back-btn{width:38px;height:38px;border:1px solid var(--line);border-radius:6px;background:#fff;color:#344054;cursor:pointer}
    .filter-band{display:flex;align-items:end;gap:10px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:14px}.quick{display:flex;gap:6px;flex-wrap:wrap}.quick button{height:36px;padding:0 13px;border:1px solid #cfd6e1;border-radius:6px;background:#fff;color:#475467;cursor:pointer}.quick button.active{border-color:#8bbcff;background:var(--blue-soft);color:var(--blue)}.date-field label{display:block;color:var(--muted);font-size:11px;margin-bottom:4px}.date-field input{height:36px;border:1px solid #cfd6e1;border-radius:6px;padding:0 9px;color:var(--ink);background:#fff}.filter-btn{height:36px;padding:0 16px;border:0;border-radius:6px;background:var(--blue);color:#fff;cursor:pointer}.range-note{margin-left:auto;color:var(--muted);font-size:12px}
    .metrics{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:14px}.metric{position:relative;min-height:112px;padding:15px;background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden}.metric-label{color:var(--muted);font-size:12px}.metric-value{margin-top:10px;font-size:24px;line-height:1;font-weight:800;font-variant-numeric:tabular-nums}.metric-sub{margin-top:10px;color:var(--muted);font-size:11px}.metric-icon{position:absolute;right:12px;top:12px;width:30px;height:30px;display:grid;place-items:center;border-radius:6px;background:var(--blue-soft);color:var(--blue)}.metric.green .metric-value{color:var(--green)}.metric.green .metric-icon{background:var(--green-soft);color:var(--green)}.metric.amber .metric-value{color:var(--amber)}.metric.amber .metric-icon{background:var(--amber-soft);color:var(--amber)}
    .panel{background:#fff;border:1px solid var(--line);border-radius:8px;margin-bottom:14px;overflow:hidden}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}.panel-title{font-size:15px;font-weight:700}.panel-note{color:var(--muted);font-size:11px}.panel-body{padding:16px}.two-cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}.two-cols .panel{margin:0}
    .funnel{display:grid;grid-template-columns:repeat(3,1fr);gap:30px;align-items:center}.funnel-step{position:relative;padding:12px 14px;border:1px solid var(--line);border-radius:7px;background:#fbfcfe}.funnel-step:not(:last-child)::after{content:"";position:absolute;right:-23px;top:50%;width:16px;height:1px;background:#aab4c3}.funnel-name{color:var(--muted);font-size:12px}.funnel-value{font-size:22px;font-weight:800;margin-top:4px}.funnel-rate{color:var(--blue);font-size:12px;margin-top:3px}
    .trend-wrap{overflow-x:auto;padding-bottom:4px}.trend{display:flex;align-items:end;gap:9px;height:190px;min-width:max-content;padding:10px 2px 0}.trend-day{width:56px;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}.bars{height:135px;display:flex;align-items:end;gap:4px}.bar{width:15px;min-height:2px;border-radius:3px 3px 0 0}.bar.invite{background:#58a2ff}.bar.amount{background:#39a96b}.day-label{margin-top:7px;color:var(--muted);font-size:10px}.trend-legend{display:flex;gap:14px;color:var(--muted);font-size:11px}.legend-dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}.legend-dot.blue{background:#58a2ff}.legend-dot.green{background:#39a96b}
    .table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:10px 8px;border-bottom:1px solid #edf0f4;text-align:right;white-space:nowrap}th{color:var(--muted);font-weight:600;background:#fafbfc}th:first-child,td:first-child{text-align:left}.rate{font-weight:700;color:var(--green)}.tag{display:inline-flex;min-height:23px;align-items:center;padding:2px 7px;border-radius:5px;background:#f2f4f7;color:#475467}.tag.local{background:var(--green-soft);color:var(--green)}.progress{width:84px;height:6px;background:#edf0f4;border-radius:3px;overflow:hidden;margin-left:auto}.progress i{display:block;height:100%;background:var(--green);border-radius:3px}
    .insights{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.insight{display:flex;gap:10px;padding:11px 12px;border-left:3px solid var(--blue);background:#f7faff}.insight.warning{border-color:var(--amber);background:var(--amber-soft)}.insight.danger{border-color:var(--red);background:var(--red-soft)}.insight i{margin-top:3px;color:var(--blue)}.insight.warning i{color:var(--amber)}.insight.danger i{color:var(--red)}.insight-title{font-weight:700;font-size:13px}.insight-text{color:var(--muted);font-size:12px;margin-top:2px}.empty{padding:24px;text-align:center;color:var(--muted)}.loading{position:fixed;inset:0;display:none;place-items:center;background:rgba(245,247,250,.72);z-index:20}.loading.show{display:grid}.loading-box{padding:15px 20px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--muted)}
    @media(max-width:1050px){.metrics{grid-template-columns:repeat(3,1fr)}}
    @media(max-width:760px){.shell{padding:14px 12px 30px}.topbar{align-items:flex-start}h1{font-size:19px}.filter-band{align-items:stretch}.quick{width:100%}.quick button{flex:1}.date-field{flex:1}.date-field input{width:100%}.filter-btn{width:100%}.range-note{width:100%;margin:0}.metrics{grid-template-columns:1fr 1fr}.metric{min-height:100px}.metric-value{font-size:21px}.two-cols{grid-template-columns:1fr}.funnel{grid-template-columns:1fr;gap:9px}.funnel-step:not(:last-child)::after{display:none}.insights{grid-template-columns:1fr}.panel-body{padding:12px}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="title-wrap">
        <div class="title-row"><h1>场地数据分析</h1><span class="venue-badge" id="venueBadge">加载中</span></div>
        <div class="subtitle">引流、转化、复购与套餐完成情况</div>
      </div>
      <button class="back-btn" type="button" onclick="history.back()" title="返回"><i class="fas fa-arrow-left"></i></button>
    </header>

    <section class="filter-band">
      <div class="quick">
        <button type="button" data-days="1">今天</button>
        <button type="button" data-days="yesterday">昨天</button>
        <button type="button" data-days="7" class="active">近7天</button>
        <button type="button" data-days="30">近30天</button>
      </div>
      <div class="date-field"><label for="startDate">开始日期</label><input id="startDate" type="date"></div>
      <div class="date-field"><label for="endDate">结束日期</label><input id="endDate" type="date"></div>
      <button class="filter-btn" id="filterBtn" type="button"><i class="fas fa-filter"></i> 查询</button>
      <div class="range-note" id="rangeNote"></div>
    </section>

    <section class="metrics">
      <div class="metric"><div class="metric-label">引流注册</div><div class="metric-value" id="registrationMetric">0人</div><div class="metric-sub">所选周期新注册</div><span class="metric-icon"><i class="fas fa-user-plus"></i></span></div>
      <div class="metric green"><div class="metric-label">付费转化率</div><div class="metric-value" id="conversionMetric">0%</div><div class="metric-sub" id="conversionSub">0人完成付费</div><span class="metric-icon"><i class="fas fa-bullseye"></i></span></div>
      <div class="metric green"><div class="metric-label">复购比例</div><div class="metric-value" id="repeatMetric">0%</div><div class="metric-sub" id="repeatSub">0人完成复购</div><span class="metric-icon"><i class="fas fa-redo"></i></span></div>
      <div class="metric"><div class="metric-label">引流用户消费</div><div class="metric-value" id="referralAmountMetric">¥0.00</div><div class="metric-sub" id="referralAmountSub">周期内全平台消费</div><span class="metric-icon"><i class="fas fa-coins"></i></span></div>
      <div class="metric amber"><div class="metric-label">外场消费占比</div><div class="metric-value" id="outflowMetric">0%</div><div class="metric-sub" id="outflowSub">外场 ¥0.00</div><span class="metric-icon"><i class="fas fa-random"></i></span></div>
      <div class="metric green"><div class="metric-label">套餐完成率</div><div class="metric-value" id="completionMetric">0%</div><div class="metric-sub" id="completionSub">0/0笔预约完成</div><span class="metric-icon"><i class="fas fa-check-circle"></i></span></div>
    </section>

    <section class="panel">
      <div class="panel-head"><div class="panel-title">引流转化漏斗</div><div class="panel-note">复购指至少完成2笔真实驾驶订单</div></div>
      <div class="panel-body"><div class="funnel" id="funnel"></div></div>
    </section>

    <section class="panel">
      <div class="panel-head"><div class="panel-title">每日趋势</div><div class="trend-legend"><span><i class="legend-dot blue"></i>引流注册</span><span><i class="legend-dot green"></i>场地实付</span></div></div>
      <div class="panel-body"><div class="trend-wrap"><div class="trend" id="trend"></div></div></div>
    </section>

    <div class="two-cols">
      <section class="panel">
        <div class="panel-head"><div class="panel-title">套餐完成度</div><div class="panel-note">按预约时长与价格归类</div></div>
        <div class="table-wrap" id="packageTable"></div>
      </section>
      <section class="panel">
        <div class="panel-head"><div class="panel-title">引流用户消费去向</div><div class="panel-note">周期内真实驾驶消费</div></div>
        <div class="table-wrap" id="destinationTable"></div>
      </section>
    </div>

    <section class="panel" style="margin-top:14px">
      <div class="panel-head"><div class="panel-title">当前在售套餐</div><div class="panel-note" id="packageCount"></div></div>
      <div class="table-wrap" id="currentPackageTable"></div>
    </section>

    <section class="panel">
      <div class="panel-head"><div class="panel-title">运营提示</div><div class="panel-note">根据所选周期自动判断</div></div>
      <div class="panel-body"><div class="insights" id="insights"></div></div>
    </section>
  </main>
  <div class="loading" id="loading"><div class="loading-box"><i class="fas fa-spinner fa-spin"></i> 正在计算场地数据...</div></div>

  <script>
    const venueId = Number(new URLSearchParams(location.search).get('venue_id'));
    const $ = id => document.getElementById(id);
    const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
    const money = value => Number(value || 0).toFixed(2);
    const ymd = date => `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;

    function setRange(days, clicked) {
      const end = new Date();
      const start = new Date();
      if (days === 'yesterday') {
        start.setDate(start.getDate() - 1);
        end.setDate(end.getDate() - 1);
      } else {
        start.setDate(start.getDate() - Number(days) + 1);
      }
      $('startDate').value = ymd(start);
      $('endDate').value = ymd(end);
      document.querySelectorAll('.quick button').forEach(btn => btn.classList.toggle('active', btn === clicked));
      loadData();
    }

    async function loadData() {
      if (!venueId) {
        alert('缺少场地ID');
        history.back();
        return;
      }
      const start = $('startDate').value;
      const end = $('endDate').value;
      if (!start || !end || start > end) {
        alert('请选择正确的日期范围');
        return;
      }
      $('loading').classList.add('show');
      try {
        const params = new URLSearchParams({venue_id: venueId, start_date: start, end_date: end, _: Date.now()});
        const response = await fetch(`/api/index/venue_data_analysis.php?${params}`);
        const result = await response.json();
        if (!result || result.code !== 0) throw new Error(result?.msg || '加载失败');
        render(result.data);
      } catch (error) {
        alert(error.message || '数据分析加载失败');
      } finally {
        $('loading').classList.remove('show');
      }
    }

    function render(data) {
      const c = data.cohort;
      const r = data.referral_period;
      const v = data.venue_period;
      $('venueBadge').textContent = `${data.venue.name}（${data.venue.id}）`;
      $('rangeNote').textContent = `${data.range.start_date} 至 ${data.range.end_date}，共${data.range.days}天`;
      $('registrationMetric').textContent = `${c.registrations}人`;
      $('conversionMetric').textContent = `${c.conversion_rate}%`;
      $('conversionSub').textContent = `${c.paid_users}人完成付费`;
      $('repeatMetric').textContent = `${c.repeat_rate}%`;
      $('repeatSub').textContent = `${c.repeat_users}人完成复购`;
      $('referralAmountMetric').textContent = `¥${money(r.total_amount)}`;
      $('referralAmountSub').textContent = `${r.active_users}名引流用户 / ${r.order_count}单`;
      $('outflowMetric').textContent = `${r.outflow_rate}%`;
      $('outflowSub').textContent = `外场 ¥${money(r.external_amount)} · 奖励约 ¥${money(r.estimated_reward)}`;
      $('completionMetric').textContent = `${v.completion_rate}%`;
      $('completionSub').textContent = `${v.completed_count}/${v.reservation_count}笔预约完成`;
      renderFunnel(c);
      renderTrend(data.trend);
      renderPackages(data.packages);
      renderDestinations(data.destinations);
      renderCurrentPackages(data.current_packages);
      renderInsights(data);
    }

    function renderFunnel(c) {
      $('funnel').innerHTML = `
        <div class="funnel-step"><div class="funnel-name">邀请码注册</div><div class="funnel-value">${c.registrations}人</div><div class="funnel-rate">转化起点</div></div>
        <div class="funnel-step"><div class="funnel-name">完成真实付费</div><div class="funnel-value">${c.paid_users}人</div><div class="funnel-rate">注册转化 ${c.conversion_rate}%</div></div>
        <div class="funnel-step"><div class="funnel-name">完成复购</div><div class="funnel-value">${c.repeat_users}人</div><div class="funnel-rate">付费用户复购 ${c.repeat_rate}%</div></div>`;
    }

    function renderTrend(rows) {
      const maxInvites = Math.max(1, ...rows.map(row => Number(row.registrations || 0)));
      const maxAmount = Math.max(1, ...rows.map(row => Number(row.venue_amount || 0)));
      $('trend').innerHTML = rows.map(row => {
        const inviteHeight = Math.max(2, Math.round(Number(row.registrations || 0) / maxInvites * 128));
        const amountHeight = Math.max(2, Math.round(Number(row.venue_amount || 0) / maxAmount * 128));
        return `<div class="trend-day" title="${esc(row.day)}：引流${row.registrations}人，场地实付¥${money(row.venue_amount)}">
          <div class="bars"><i class="bar invite" style="height:${inviteHeight}px"></i><i class="bar amount" style="height:${amountHeight}px"></i></div>
          <div class="day-label">${esc(row.day.slice(5))}</div></div>`;
      }).join('');
    }

    function renderPackages(rows) {
      if (!rows.length) { $('packageTable').innerHTML = '<div class="empty">当前周期暂无预约套餐数据</div>'; return; }
      $('packageTable').innerHTML = `<table><thead><tr><th>套餐</th><th>预约</th><th>完成</th><th>取消</th><th>完成率</th></tr></thead><tbody>${rows.map(row => `<tr>
        <td>${row.minutes}分钟 / ${money(row.price)}电池</td><td>${row.reservation_count}</td><td>${row.completed_count}</td><td>${row.cancelled_count}</td>
        <td><span class="rate">${row.completion_rate}%</span><div class="progress"><i style="width:${Math.min(100,row.completion_rate)}%"></i></div></td></tr>`).join('')}</tbody></table>`;
    }

    function renderDestinations(rows) {
      if (!rows.length) { $('destinationTable').innerHTML = '<div class="empty">当前周期暂无引流用户消费</div>'; return; }
      $('destinationTable').innerHTML = `<table><thead><tr><th>消费场地</th><th>用户</th><th>订单</th><th>金额</th></tr></thead><tbody>${rows.map(row => `<tr>
        <td>${esc(row.venue_name)} ${row.is_local ? '<span class="tag local">本场</span>' : '<span class="tag">外场</span>'}</td><td>${row.user_count}</td><td>${row.order_count}</td><td>¥${money(row.payment_amount)}</td></tr>`).join('')}</tbody></table>`;
    }

    function renderCurrentPackages(rows) {
      $('packageCount').textContent = `${rows.length}个套餐`;
      if (!rows.length) { $('currentPackageTable').innerHTML = '<div class="empty">当前场地没有独立套餐，将使用平台默认套餐</div>'; return; }
      $('currentPackageTable').innerHTML = `<table><thead><tr><th>套餐名称</th><th>时长</th><th>价格</th><th>分钟单价</th><th>类型</th></tr></thead><tbody>${rows.map(row => `<tr>
        <td>${esc(row.title)}</td><td>${row.minutes}分钟</td><td>${money(row.battery)}电池</td><td>${row.minutes ? money(Number(row.battery)/row.minutes) : '0.00'}</td><td>${esc(row.pricing_type)}</td></tr>`).join('')}</tbody></table>`;
    }

    function renderInsights(data) {
      const c = data.cohort, r = data.referral_period, v = data.venue_period;
      const items = [];
      if (c.registrations < data.range.days) items.push(['warning','引流量偏低',`周期日均引流${(c.registrations/data.range.days).toFixed(1)}人，建议增加站外直播和邀请码曝光。`]);
      else items.push(['','引流节奏稳定',`周期累计引流${c.registrations}人，日均${(c.registrations/data.range.days).toFixed(1)}人。`]);
      if (c.registrations > 0 && c.conversion_rate < 20) items.push(['danger','首单转化偏低',`当前付费转化率${c.conversion_rate}%，优先检查最低套餐、直播引导和新用户首单路径。`]);
      else items.push(['','首单转化',`邀请码用户付费转化率${c.conversion_rate}%，平均首单耗时${c.avg_first_order_hours == null ? '暂无' : c.avg_first_order_hours+'小时'}。`]);
      if (c.paid_users > 0 && c.repeat_rate < 30) items.push(['warning','复购仍有提升空间',`付费用户复购率${c.repeat_rate}%，可在首单后24小时内做回访或复玩激励。`]);
      else items.push(['','复购表现',`付费用户复购率${c.repeat_rate}%，复购人数${c.repeat_users}人。`]);
      if (v.reservation_count > 0 && v.completion_rate < 70) items.push(['danger','预约取消较多',`套餐完成率${v.completion_rate}%，取消${v.cancelled_count}笔，建议检查排队、设备可用率和开始驾驶链路。`]);
      else items.push(['','套餐履约',`套餐完成率${v.completion_rate}%，周期客单价¥${money(v.average_order_value)}。`]);
      items.push(['','引流价值',`引流用户周期消费¥${money(r.total_amount)}，其中外场¥${money(r.external_amount)}，预计产生推广收益¥${money(r.estimated_reward)}。`]);
      $('insights').innerHTML = items.map(([level,title,text]) => `<div class="insight ${level}"><i class="fas ${level==='danger'?'fa-exclamation-circle':level==='warning'?'fa-exclamation-triangle':'fa-info-circle'}"></i><div><div class="insight-title">${title}</div><div class="insight-text">${text}</div></div></div>`).join('');
    }

    document.querySelectorAll('.quick button').forEach(button => button.addEventListener('click', () => setRange(button.dataset.days, button)));
    $('filterBtn').addEventListener('click', () => { document.querySelectorAll('.quick button').forEach(btn => btn.classList.remove('active')); loadData(); });
    const end = new Date(), start = new Date(); start.setDate(start.getDate() - 6);
    $('startDate').value = ymd(start); $('endDate').value = ymd(end);
    loadData();
  </script>
</body>
</html>
