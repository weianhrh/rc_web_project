<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MCN车辆调配</title>
<link rel="stylesheet" href="/res/fa/css/all.min.css">
<style>
:root{--primary:#1677ff;--text:#172033;--muted:#667085;--line:#e4e9f2}
*{box-sizing:border-box;letter-spacing:0}body{margin:0;background:#f7f9fc;color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
main{max-width:1240px;margin:auto;padding:24px}header{display:flex;align-items:center;gap:12px;margin-bottom:24px}h1{font-size:22px;margin:0;flex:1}h2{font-size:17px;margin:0 0 18px}button,input,select{font:inherit}button,.back{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:38px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--text);padding:8px 12px;cursor:pointer;text-decoration:none}button:hover,.back:hover{border-color:var(--primary)}button:disabled{opacity:.5;cursor:not-allowed}.primary{background:var(--primary);color:#fff;border-color:var(--primary)}.icon{width:38px;padding:0}.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:18px 0}input,select{min-height:40px;max-width:100%;border:1px solid #cbd3df;border-radius:6px;background:#fff;color:var(--text);padding:8px 12px}input{width:260px}#count{margin-left:auto;color:var(--muted)}.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line)}.tab{border:0;border-radius:0;background:transparent;padding:12px 0;border-bottom:2px solid transparent}.tab.active{color:var(--primary);border-bottom-color:var(--primary)}.table-wrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:6px}table{width:100%;border-collapse:collapse;min-width:850px;text-align:left}th{background:#f1f5f9;color:var(--muted);font-weight:500;white-space:nowrap}td,th{padding:13px 16px;border-bottom:1px solid var(--line)}tbody tr:last-child td{border-bottom:0}td small{display:block;color:var(--muted);margin-top:3px;overflow-wrap:anywhere}.good{color:#168253}.blocked{color:#b42318}.empty{text-align:center;padding:44px;color:var(--muted)}#notice{min-height:22px;margin:12px 0;color:#b42318}dialog{width:440px;max-width:calc(100% - 32px);padding:24px;border:1px solid var(--line);border-radius:8px;color:var(--text)}dialog::backdrop{background:rgba(17,24,39,.4)}dialog label{display:block;color:var(--muted);margin-top:18px}dialog select{width:100%;margin-top:7px}.dialog-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:24px}#dialogError{color:#b42318;margin:12px 0 0;min-height:22px}#currentVehicle{overflow-wrap:anywhere}#logsToolbar,.platform-history-caption{color:var(--muted);padding:16px 0}[hidden]{display:none!important}@media(max-width:600px){main{padding:16px}h1{font-size:19px}header{gap:9px;flex-wrap:wrap}.back{padding:8px}.toolbar{gap:8px}.toolbar input{width:100%}.toolbar select{flex:1;min-width:130px}#count{width:100%;margin:0}td,th{padding:12px}.table-wrap{border-radius:4px}}
</style>
<style>
.wifi-name{display:block;max-width:220px;overflow-wrap:anywhere;font-weight:500}.wifi-meta{font-size:11px;color:var(--muted);margin:12px 0}.wifi-cell{min-width:150px}@media(max-width:600px){#vehiclesBody td:nth-child(3),#vehiclesBody td:nth-child(6){grid-column:1/-1}#vehiclesBody td:nth-child(5){grid-column:auto}.wifi-name{max-width:100%}.wifi-cell{min-width:0}}
</style>
<style>
@media(max-width:600px){.table-wrap{border:0;background:transparent;overflow:visible}table{min-width:0;display:block}thead{display:none}tbody{display:grid;gap:12px}tbody tr{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);background:#fff;border:1px solid var(--line);border-radius:6px;padding:8px}td{display:block;min-width:0;padding:8px;border:0;overflow-wrap:anywhere}td::before{content:attr(data-label);display:block;font-size:12px;color:var(--muted);margin-bottom:4px}td:first-child,td:nth-child(5),td:last-child{grid-column:1/-1}td:last-child button{width:100%}td.empty{grid-column:1/-1;padding:28px}td.empty::before{display:none}}
</style>
<style>
.vehicle-actions,.platform-options{display:flex;gap:8px;flex-wrap:wrap}
.platform-options button{flex:1}
#platformStatus{min-height:22px;margin:12px 0}
#platformVehicle{overflow-wrap:anywhere}
@media(max-width:600px){.vehicle-actions button{flex:1}}
</style>
</head>
<body><main>
<header><a class="back" id="back" href="/res/index.html"><i class="fas fa-arrow-left" aria-hidden="true"></i>全部场地汇总</a><h1>车辆调配</h1><button class="icon" id="refresh" title="刷新" aria-label="刷新"><i class="fas fa-sync-alt" aria-hidden="true"></i></button></header>
<nav class="tabs"><button class="tab active" id="vehiclesTab">旗下车辆</button><button class="tab" id="logsTab">调配记录</button><button class="tab" id="platformLogsTab">平台切换记录</button></nav>
<section id="vehiclesPanel"><div class="toolbar"><input id="search" placeholder="搜索车辆、设备编号、Room ID或Wi-Fi" aria-label="搜索车辆"><select id="venueFilter" aria-label="当前场地"><option value="">全部场地</option></select><select id="stateFilter" aria-label="调配状态"><option value="">全部状态</option><option value="ready">可调配</option><option value="blocked">不可调配</option></select><span id="count"></span></div><p class="wifi-meta">Room ID为车辆主图传设备房间号。最近Wi-Fi取最后成功下发的配置，不代表当前实际连接；不展示密码。</p><div class="table-wrap"><table><thead><tr><th>车辆 / 设备编号</th><th>当前场地</th><th>Room ID / 最近Wi-Fi</th><th>设备状态</th><th>共享状态</th><th>调配状态</th><th>最近下发平台</th><th>操作</th></tr></thead><tbody id="vehiclesBody"><tr><td colspan="8" class="empty">加载中...</td></tr></tbody></table></div></section>
<section id="logsPanel" hidden><div id="logsToolbar">最近50条调配记录</div><div class="table-wrap"><table><thead><tr><th>时间</th><th>设备编号</th><th>原场地</th><th>目标场地</th><th>操作账号ID</th></tr></thead><tbody id="logsBody"></tbody></table></div></section>
<section id="platformLogsPanel" hidden>
  <p class="platform-history-caption">最近 50 条成功下发的切换记录</p>
  <div class="table-wrap"><table>
    <thead><tr><th>发送时间</th><th>车辆 / 设备编号</th><th>发送时场地</th><th>下发平台</th><th>操作账号</th></tr></thead>
    <tbody id="platformLogsBody"></tbody>
  </table></div>
</section>
<div id="notice" role="status" aria-live="polite"></div>
<dialog id="transferDialog"><h2>切换绑定场地</h2><div id="currentVehicle"></div><label for="targetVenue">目标场地</label><select id="targetVenue"></select><div id="dialogError" role="alert"></div><div class="dialog-actions"><button id="cancelTransfer">取消</button><button id="confirmTransfer" class="primary"><i class="fas fa-exchange-alt" aria-hidden="true"></i>确认切换</button></div></dialog>
<dialog id="platformDialog" aria-labelledby="platformTitle">
  <h2 id="platformTitle">切换平台</h2>
  <div id="platformVehicle"></div>
  <div id="platformPicker">
    <p>请选择接收这台车辆电压回传的平台。</p>
    <div class="platform-options">
      <button type="button" class="primary" data-target="rc">RC物联</button>
      <button type="button" class="primary" data-target="xhyk">星河远控</button>
    </div>
  </div>
  <div id="platformConfirm" hidden>
    <p id="platformPrompt"></p>
    <div class="dialog-actions">
      <button type="button" id="cancelPlatformSend">取消</button>
      <button type="button" id="confirmPlatformSend" class="primary">确认发送</button>
    </div>
  </div>
  <p id="platformStatus" role="status" aria-live="polite"></p>
  <div class="dialog-actions">
    <button type="button" data-target="check">查询流状态</button>
    <button type="button" data-target="reset">恢复默认</button>
    <button type="button" id="closePlatform">关闭</button>
  </div>
</dialog>
</main>
<script>
const api='/api/index/MCNVehicleTransfer.php';
let data={venues:[],vehicles:[],logs:[],csrf_token:''},selected=null,busy=false;
const $=id=>document.getElementById(id);
function cell(tr,text){const td=document.createElement('td');td.textContent=text;tr.appendChild(td);return td;}
function empty(body,columns,text){const tr=document.createElement('tr');const td=cell(tr,text);td.colSpan=columns;td.className='empty';body.replaceChildren(tr);}
function render(){
 const query=$('search').value.trim().toLowerCase(),venue=$('venueFilter').value,state=$('stateFilter').value;
 const rows=data.vehicles.filter(v=>(!venue||String(v.venue_id)===venue)&&(!query||(v.name+' '+v.serial_number+' '+(v.room_id||'')+' '+(v.last_wifi_name||'')).toLowerCase().includes(query))&&(!state||(state==='ready')===v.can_transfer));
 $('count').textContent=`共${rows.length}台 · 可调配${rows.filter(v=>v.can_transfer).length}台`;
 const body=$('vehiclesBody');body.replaceChildren();
 for(const v of rows){const tr=document.createElement('tr');const td=cell(tr,v.name);const small=document.createElement('small');small.textContent=v.serial_number;td.appendChild(small);cell(tr,`${v.venue_name}（${v.venue_id}）`);const wifi=cell(tr,'');wifi.className='wifi-cell';const room=document.createElement('span');room.className='room-id';room.style.display='block';room.textContent=`Room ID：${v.room_id||'未关联'}`;wifi.append(room);const wifiName=document.createElement('span');wifiName.className='wifi-name';wifiName.textContent=v.last_wifi_name||(v.last_wifi_at?'名称为空':'暂无记录');wifi.append(wifiName);if(v.last_wifi_at){const time=document.createElement('small');time.textContent=v.last_wifi_at;wifi.append(time);}cell(tr,v.status);cell(tr,v.sharing_status);cell(tr,v.can_transfer?'可调配':v.blocked_reason).className=v.can_transfer?'good':'blocked';const lastPlatform = cell(tr, v.can_switch_platform === true ? (v.last_platform_label || '尚无记录') : '—');
 if (v.can_switch_platform === true && v.last_platform_at) {
   const sentAt = document.createElement('small');
   sentAt.textContent = v.last_platform_at;
   lastPlatform.appendChild(sentAt);
 }
 const action=cell(tr,'');const button=document.createElement('button');button.type='button';const icon=document.createElement('i');icon.className='fas fa-exchange-alt';icon.setAttribute('aria-hidden','true');button.append(icon,document.createTextNode('切换场地'));button.disabled=!v.can_transfer||data.venues.filter(t=>Number(t.id)!==v.venue_id&&Number(t.is_banned)!==1).length===0;button.title=v.blocked_reason||'切换绑定场地';button.onclick=()=>openTransfer(v);const actions=document.createElement('div');actions.className='vehicle-actions';
 actions.appendChild(button);
 if (v.can_switch_platform === true) {
   const platformButton = document.createElement('button');
   platformButton.type = 'button';
   platformButton.textContent = '切换平台';
   platformButton.disabled = v.can_transfer !== true;
   platformButton.title = platformButton.disabled ? (v.blocked_reason || '车辆当前不可调配') : '切换平台';
   platformButton.onclick = () => openPlatform(v);
   actions.appendChild(platformButton);
 }
 action.appendChild(actions);body.appendChild(tr);}
 body.querySelectorAll('tr').forEach(tr=>Array.from(tr.children).forEach((td,i)=>td.dataset.label=['车辆 / 设备编号','当前场地','Room ID / 最近Wi-Fi','设备状态','共享状态','调配状态','最近下发平台','操作'][i]));
 if(!rows.length)empty(body,8,'暂无符合条件的车辆');
 const logs=$('logsBody');logs.replaceChildren();for(const log of data.logs){const tr=document.createElement('tr');[log.created_at,log.serial_number,log.source_venue_name||'-',log.target_venue_name||'-',log.operator_admin_id].forEach(v=>cell(tr,v));Array.from(tr.children).forEach((td,i)=>td.dataset.label=['时间','设备编号','原场地','目标场地','操作账号ID'][i]);logs.appendChild(tr);}if(!data.logs.length)empty(logs,5,'暂无调配记录');
}
let listRequest = 0;
async function load(){
 const request = ++listRequest;
 try {
   const response = await fetch(api, {credentials:'same-origin',cache:'no-store'});
   if (!response.ok) throw new Error('加载失败，请稍后重试');
   const result = await response.json();
   if (request !== listRequest) return;
   if (result.code !== 0) throw new Error(result.msg || '加载失败');
   data = result.data;
   const filter = $('venueFilter'), old = filter.value;
   filter.replaceChildren(new Option('全部场地',''));
   for (const v of data.venues) filter.add(new Option(v.venue_name + '（' + v.id + '）',v.id));
   filter.value = old;
   render();
   $('notice').textContent = '';
 } catch(error) {
   if (request !== listRequest) return;
   data = {venues:[],vehicles:[],logs:[],csrf_token:''};
   render();
   $('notice').textContent = error.message;
 }
}
let historyRequest = 0;
async function loadPlatformLogs() {
 const request = ++historyRequest;
 const body = $('platformLogsBody');
 empty(body, 5, '正在加载平台切换记录…');
 try {
   const response = await fetch(api + '?view=platform_logs', {credentials:'same-origin', cache:'no-store'});
   if (!response.ok) throw new Error('切换记录加载失败，请点刷新重试');
   const result = await response.json();
   if (request !== historyRequest) return;
   if (result.code !== 0 || !Array.isArray(result.data?.logs)) {
     throw new Error(result.msg || '切换记录加载失败，请点刷新重试');
   }
   if (!result.data.logs.length) {
     empty(body, 5, '暂无平台切换记录');
     return;
   }
   body.replaceChildren();
   for (const log of result.data.logs) {
     const tr = document.createElement('tr');
     const values = [log.created_at, log.vehicle_name, log.venue_name, log.platform_label, log.operator_name || log.operator_admin_id];
     const labels = ['发送时间','车辆 / 设备编号','发送时场地','下发平台','操作账号'];
     values.forEach((value, i) => {
       const td = cell(tr, value || '—');
       td.dataset.label = labels[i];
       if (i === 1 && log.serial_number) {
         const serial = document.createElement('small');
         serial.textContent = log.serial_number;
         td.appendChild(serial);
       }
     });
     body.appendChild(tr);
   }
 } catch (error) {
   if (request === historyRequest) empty(body, 5, error.message || '切换记录加载失败，请点刷新重试');
 }
}
let platformVehicle = null;
const platformDialog = $('platformDialog');
function openPlatform(vehicle) {
 if (busy || vehicle.can_transfer !== true || vehicle.can_switch_platform !== true) return;
 platformVehicle = vehicle;
 $('platformVehicle').textContent = vehicle.name + '（' + vehicle.serial_number + '） · ' + vehicle.venue_name + ' · Room ID ' + (vehicle.room_id || '未关联');
 showPlatformStep('pick');
 $('platformStatus').textContent = '';
 platformDialog.showModal();
}
let pendingPlatform = null;
function showPlatformStep(step) {
 $('platformPicker').hidden = step !== 'pick';
 $('platformConfirm').hidden = step !== 'confirm';
 platformDialog.querySelectorAll('[data-target="check"], [data-target="reset"]').forEach(button => {
   button.hidden = step !== 'pick';
 });
 $('closePlatform').hidden = step === 'confirm' || step === 'sending';
 $('closePlatform').textContent = step === 'result' ? '知道了' : '关闭';
 $('platformTitle').textContent = {
   pick: '切换平台', confirm: '确认切换平台', sending: '正在发送', result: '发送结果'
 }[step];
 if (step !== 'confirm') pendingPlatform = null;
}
async function runPlatformAction(target) {
 if (busy || !platformVehicle) return;
 busy = true;
 const status = $('platformStatus');
 let showResult = target === 'rc' || target === 'xhyk';
 const buttons = platformDialog.querySelectorAll('button');
 buttons.forEach(button => button.disabled = true);
 status.className = '';
 status.textContent = target === 'check' ? '正在查询流状态…' : '正在查流并发送指令…';
 try {
   const body = new URLSearchParams({
     command_type: 'mcn_voltage_platform', target,
     vehicle_id: String(platformVehicle.id), expected_room: String(platformVehicle.room_id || '').trim(),
     expected_venue: String(platformVehicle.venue_id)
   });
   const response = await fetch('/api/devMgr/device_command.php', {
     method: 'POST', credentials: 'same-origin', headers: {'X-CSRF-Token': data.csrf_token}, body
   });
   if (!response.ok) throw new Error('请求结果未知，请刷新车辆状态后确认');
   const result = await response.json();
   if (result.code === 409) {
     load();
     showResult = true;
   }
   if (result.code !== 200) throw new Error(result.msg || '操作失败');
   status.className = 'good';
   status.textContent = result.msg;
   if (target !== 'check') load();
 } catch (error) {
   status.className = 'blocked';
   status.textContent = error.message;
 } finally {
   busy = false;
   buttons.forEach(button => button.disabled = false);
   if (showResult) {
     showPlatformStep('result');
     $('closePlatform').focus();
   }
 }
}
platformDialog.querySelectorAll('[data-target]').forEach(button => {
 button.onclick = () => {
   if (busy) return;
   const target = button.dataset.target;
   if (target !== 'rc' && target !== 'xhyk') return runPlatformAction(target);
   pendingPlatform = target;
   $('platformStatus').textContent = '';
   $('platformPrompt').textContent = '确认将这台车辆的电压回传平台切换到「' + button.textContent.trim() + '」吗？';
   showPlatformStep('confirm');
   $('cancelPlatformSend').focus();
 };
});
$('cancelPlatformSend').onclick = () => {
 if (busy || !pendingPlatform) return;
 const choice = pendingPlatform;
 showPlatformStep('pick');
 platformDialog.querySelector('[data-target="' + choice + '"]').focus();
};
$('confirmPlatformSend').onclick = () => {
 if (busy || !pendingPlatform) return;
 const target = pendingPlatform;
 showPlatformStep('sending');
 return runPlatformAction(target);
};
$('closePlatform').onclick = () => { if (!busy) platformDialog.close(); };
platformDialog.addEventListener('cancel', event => { if (busy) event.preventDefault(); });
function openTransfer(v){if(busy)return;selected=v;$('currentVehicle').textContent=`${v.name}（${v.serial_number}） · ${v.venue_name}`;$('targetVenue').replaceChildren(new Option('请选择目标场地',''));for(const target of data.venues){if(Number(target.id)===v.venue_id)continue;const option=new Option(`${target.venue_name}（${target.id}）${Number(target.is_banned)===1?' · 已封禁':''}`,target.id);option.disabled=Number(target.is_banned)===1;$('targetVenue').add(option);}$('dialogError').textContent='';$('transferDialog').showModal();}
$('confirmTransfer').onclick=async()=>{
 if(busy||!selected)return;if(!$('targetVenue').value){$('dialogError').textContent='请选择目标场地';return;}
 busy=true;$('confirmTransfer').disabled=true;$('cancelTransfer').disabled=true;$('dialogError').textContent='';
 try{const response=await fetch(api,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRF-Token':data.csrf_token},body:JSON.stringify({vehicle_id:selected.id,source_venue_id:selected.venue_id,target_venue_id:Number($('targetVenue').value)})});if(!response.ok)throw new Error('请求失败，请刷新车辆状态后确认结果');const result=await response.json();if(result.code!==0)throw new Error(result.msg||'切换失败');$('transferDialog').close();await load();$('notice').style.color='#168253';$('notice').textContent=result.msg;}
 catch(error){$('dialogError').textContent=error.message;}
 finally{busy=false;$('confirmTransfer').disabled=false;$('cancelTransfer').disabled=false;}
};
$('cancelTransfer').onclick=()=>{if(!busy)$('transferDialog').close();};$('transferDialog').addEventListener('cancel',event=>{if(busy)event.preventDefault();});
$('back').onclick=()=>{document.cookie='venue_scope=all; path=/; SameSite=Lax; Secure';};
$('refresh').onclick=()=>{
 if (busy) return;
 $('notice').style.color='#b42318';
 if ($('platformLogsPanel').hidden) load(); else loadPlatformLogs();
};
for(const id of ['search','venueFilter','stateFilter'])$(id).addEventListener(id==='search'?'input':'change',render);
const tabs = ['vehicles', 'logs', 'platformLogs'];
for (const name of tabs) {
 $(name + 'Tab').onclick = () => {
   for (const item of tabs) {
     $(item + 'Panel').hidden = item !== name;
     $(item + 'Tab').classList.toggle('active', item === name);
   }
   $('notice').hidden = name === 'platformLogs';
   if (name === 'platformLogs') loadPlatformLogs();
 };
}
load();
</script></body></html>
