<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>图文审核平台</title>
  <style>
    :root {
      --primary: #5b8cff;
      --secondary: #7f8fa4;
      --background-gradient-start: #f8f9ff;
      --background-gradient-end: #f0f3ff;
      --card-bg: #ffffff;
      --border-color: #ddd;
      --text-color: #333;
      --shadow: 0 4px 24px rgba(91, 140, 255, 0.08);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "PingFang SC", system-ui;
    }

    body {
      background: linear-gradient(135deg, var(--background-gradient-start), var(--background-gradient-end));
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: var(--shadow);
      /*padding: 24px;*/
      margin-bottom: 30px;
    }

    .venue-card {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 16px;
      padding: 12px;
      border-bottom: 1px solid var(--border-color);
    }

    .venue-img {
      width: 80px;
      height: 80px;
      border-radius: 8px;
      object-fit: cover;
      cursor: pointer;
    }

    .venue-info {
      flex: 1;
    }

    .venue-actions button {
      margin-right: 10px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 24px;
    }

    th, td {
      padding: 12px;
      border: 1px solid var(--border-color);
      text-align: left;
      font-size: 14px;
      color: var(--text-color);
    }

    th {
      background-color: #f0f3ff;
      font-weight: 600;
    }

    th[data-hide="true"], td[data-hide="true"] {
      display: none;
    }

    button {
      padding: 6px 12px;
      border: none;
      background: var(--primary);
      color: #fff;
      border-radius: 6px;
      cursor: pointer;
    }

    button.danger {
      background-color: #e74c3c;
    }

    .textarea-box {
      margin-top: 10px;
    }

    textarea {
      width: 100%;
      padding: 8px;
      font-size: 14px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      resize: vertical;
    }

    .loading {
      text-align: center;
      padding: 20px;
      color: var(--secondary);
    }

    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: rgba(0,0,0,0.8);
    }

    .modal-content {
      display: block;
      margin: 5% auto;
      max-width: 80%;
      border-radius: 12px;
    }
       .card-title {
      font-size: 24px;
      color: var(--text-color);
      margin-bottom: 20px;
      font-weight: 600;
      border-bottom: 2px solid var(--primary);
      padding-bottom: 10px;
      text-align: left;
    }
    .actions-cell {
  text-align: center;
  white-space: nowrap;
  vertical-align: middle;
}
.venue-card {
  display: flex;

  }

}

  }

  }

  }

  }
}


/* 审核操作统一模态框 */
.audit-modal-mask {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 10000;
  background: rgba(15, 23, 42, .48);
  padding: 20px;
  align-items: center;
  justify-content: center;
}
.audit-modal-mask.show { display: flex; }
.audit-modal-card {
  width: min(460px, 100%);
  background: #fff;
  border-radius: 16px;
  box-shadow: 0 18px 60px rgba(15,23,42,.24);
  overflow: hidden;
}
.audit-modal-head {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 18px 20px 10px;
}
.audit-modal-icon {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  background: var(--primary);
  flex-shrink: 0;
}
.audit-modal-icon.success { background: #22c55e; }
.audit-modal-icon.warning { background: #f59e0b; }
.audit-modal-icon.error { background: #ef4444; }
.audit-modal-title {
  font-size: 17px;
  font-weight: 700;
  color: #172033;
}
.audit-modal-body {
  padding: 8px 20px 18px;
  color: #4b5563;
  font-size: 14px;
  line-height: 1.7;
  word-break: break-word;
}
.audit-modal-body .review-value {
  margin-top: 8px;
  padding: 10px 12px;
  border-radius: 10px;
  background: #f8faff;
  border: 1px solid #e2e8ff;
  color: #1f2d4d;
}
.audit-modal-textarea {
  width: 100%;
  min-height: 96px;
  margin-top: 10px;
  border: 1px solid #d7dded;
  border-radius: 10px;
  padding: 10px;
  font-size: 14px;
  outline: none;
  resize: vertical;
}
.audit-modal-textarea:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(91,140,255,.12);
}
.audit-modal-actions {
  padding: 14px 20px 18px;
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  border-top: 1px solid #eef2ff;
}
.audit-modal-btn {
  min-width: 82px;
  border: none;
  border-radius: 9px;
  padding: 9px 14px;
  cursor: pointer;
  font-size: 14px;
}
.audit-modal-btn.cancel { background: #f3f4f6; color: #374151; }
.audit-modal-btn.confirm { background: var(--primary); color: #fff; }
.audit-modal-btn.danger { background: #e74c3c; color: #fff; }
@media (max-width: 520px) {
  .audit-modal-actions { flex-direction: column-reverse; }
  .audit-modal-btn { width: 100%; }
}


  </style>

      <button type="button" class="audit-modal-btn cancel" id="audit-modal-cancel">取消</button>

<!-- 脚本逻辑将在下一步注入 -->
<script src="https://gosspublic.alicdn.com/aliyun-oss-sdk-6.17.1.min.js"></script>
  <script>

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function escapeJs(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/\\/g, '\\\\')
        .replace(/'/g, "\\'")
        .replace(/"/g, '&quot;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/\n/g, '\\n')
        .replace(/\r/g, '');
    }

    function showAuditModal(options = {}) {
      const mask = document.getElementById('audit-modal-mask');
      const icon = document.getElementById('audit-modal-icon');
      const titleEl = document.getElementById('audit-modal-title');
      const bodyEl = document.getElementById('audit-modal-body');
      const confirmBtn = document.getElementById('audit-modal-confirm');
      const cancelBtn = document.getElementById('audit-modal-cancel');
      if (!mask || !titleEl || !bodyEl || !confirmBtn || !cancelBtn) {
        return Promise.resolve({ confirmed: true, value: '' });
      }

      const type = options.type || 'info';
      titleEl.textContent = options.title || '提示';
      icon.className = 'audit-modal-icon ' + type;
      icon.textContent = type === 'success' ? '✓' : (type === 'error' ? '×' : (type === 'warning' ? '!' : 'i'));
      confirmBtn.textContent = options.confirmText || '确定';
      cancelBtn.textContent = options.cancelText || '取消';
      cancelBtn.style.display = options.showCancel ? '' : 'none';
      confirmBtn.className = 'audit-modal-btn confirm' + (options.danger ? ' danger' : '');

      let html = options.message || '';
      if (options.textarea) {
        html += `<textarea class="audit-modal-textarea" id="audit-modal-textarea" placeholder="${escapeHtml(options.placeholder || '请输入拒绝理由')}">${escapeHtml(options.defaultValue || '')}</textarea>`;
      }
      bodyEl.innerHTML = html;

      return new Promise(resolve => {
        let resolved = false;
        const close = (confirmed) => {
          if (resolved) return;
          resolved = true;
          const textarea = document.getElementById('audit-modal-textarea');
          const value = textarea ? textarea.value : '';
          mask.classList.remove('show');
          mask.setAttribute('aria-hidden', 'true');
          confirmBtn.onclick = null;
          cancelBtn.onclick = null;
          mask.onclick = null;
          document.onkeydown = null;
          resolve({ confirmed, value });
        };

        confirmBtn.onclick = () => close(true);
        cancelBtn.onclick = () => close(false);
        mask.onclick = (event) => {
          if (event.target === mask && options.showCancel) close(false);
        };
        document.onkeydown = (event) => {
          if (event.key === 'Escape' && options.showCancel) close(false);
        };

        mask.classList.add('show');
        mask.setAttribute('aria-hidden', 'false');
        setTimeout(() => {
          const textarea = document.getElementById('audit-modal-textarea');
          (textarea || confirmBtn).focus();
        }, 30);
      });
    }

    function auditAlert(message, title = '提示', type = 'info') {
      return showAuditModal({
        title,
        type,
        message: `<div>${escapeHtml(message)}</div>`,
        confirmText: '知道了'
      });
    }

    async function auditConfirm(message, title = '确认操作', type = 'warning') {
      const result = await showAuditModal({
        title,
        type,
        message: `<div>${escapeHtml(message)}</div>`,
        confirmText: '确定',
        cancelText: '取消',
        showCancel: true
      });
      return result.confirmed;
    }

    async function openDeviceRejectModal(id, field, fieldText, newValue) {
      const result = await showAuditModal({
        title: `拒绝${fieldText}审核`,
        type: 'warning',
        danger: true,
        message: `<div>请输入拒绝原因，提交后用户再次进入修改设备信息页会看到该原因。</div><div class="review-value"><strong>${escapeHtml(fieldText)}：</strong>${escapeHtml(newValue || '')}</div>`,
        textarea: true,
        defaultValue: '内容不适宜',
        placeholder: '请输入拒绝理由',
        confirmText: '确认拒绝',
        cancelText: '取消',
        showCancel: true
      });
      if (!result.confirmed) return;
      const reason = (result.value || '').trim();
      if (!reason) {
        await auditAlert('请输入拒绝理由', '提示', 'warning');
        return openDeviceRejectModal(id, field, fieldText, newValue);
      }
      await rejectDevice(id, field, reason);
    }

    async function loadList() {
  const res = await fetch("https://open.rcwulian.cn/api/venue/get_audit_list.php");
  const result = await res.json();
  const list = result.data?.name_list || [];

  const container = document.getElementById("audit-list-card");
  container.innerHTML = "";

  list.forEach(item => {
    const time = new Date(item.timestamp * 1000).toLocaleString();
    const card = document.createElement("div");
    card.className = "venue-card";
    card.innerHTML = `
      <div class="venue-info">
        <span class="venue-name">提交名称：${item.venue_name}</span>
        <span>场地ID: ${item.venue_id}</span>
        <span>提交时间: ${time}</span>
      </div>
      <div class="venue-actions">
        <button class="edit-btn" onclick="approve(${item.venue_id})">通过</button>
        <button class="edit-btn danger" onclick="toggleReject(${item.venue_id})">拒绝</button>
      </div>
      <div class="textarea-box" id="reject-box-${item.venue_id}" style="display:none;">
        <textarea id="reason-${item.venue_id}" rows="2" placeholder="请输入拒绝理由">内容不适宜</textarea>
        <button class="danger" onclick="reject(${item.venue_id})" style="margin-top:8px;">确认拒绝</button>
      </div>
    `;
    container.appendChild(card);
  });

  notifyTextCount();
}

    async function loadDeviceList() {
  const res = await fetch("https://open.rcwulian.cn/api/venue/getPendingVehicleNameAudits.php");
  const result = await res.json();
  const list = result.data || [];

  const container = document.getElementById("device-audit-list-card");
  container.innerHTML = "";

  list.forEach(item => {
    const time = new Date(item.timestamp * 1000).toLocaleString();
    const fieldText = item.field === 'name' ? '设备名称' : '分享名称';

    const card = document.createElement("div");
    card.className = "venue-card";
    card.innerHTML = `
      <div class="venue-info">
        <span class="venue-name">${fieldText}：${escapeHtml(item.new || '')}</span>
        <span>原值: ${escapeHtml(item.old || '-')}</span>
        <span>设备ID: ${escapeHtml(item.device_id || '')}</span>
        <span>提交时间: ${time}</span>
      </div>
      <div class="venue-actions">
        <button class="edit-btn" onclick="approveDevice('${escapeJs(item.device_id)}', '${escapeJs(item.field)}')">通过</button>
        <button class="edit-btn danger" onclick="openDeviceRejectModal('${escapeJs(item.device_id)}', '${escapeJs(item.field)}', '${escapeJs(fieldText)}', '${escapeJs(item.new)}')">拒绝</button>
      </div>
    `;
    container.appendChild(card);
  });

  notifyTextCount();
}

    async function loadDescList() {
  const res = await fetch("https://open.rcwulian.cn/api/venue/get_audit_list.php");
  const result = await res.json();
  const list = result.data?.desc_list || [];

  const container = document.getElementById("desc-audit-list-card");
  container.innerHTML = "";

  list.forEach(item => {
    const time = new Date(item.timestamp * 1000).toLocaleString();
    const card = document.createElement("div");
    card.className = "venue-card";
    card.innerHTML = `
      <div class="venue-info">
        <span class="venue-name">提交描述：${item.venue_description}</span>
        <span>场地ID: ${item.venue_id}</span>
        <span>提交时间: ${time}</span>
      </div>
      <div class="venue-actions">
        <button class="edit-btn" onclick="approveDesc(${item.venue_id})">通过</button>
        <button class="edit-btn danger" onclick="toggleRejectDesc(${item.venue_id})">拒绝</button>
      </div>
      <div class="textarea-box" id="reject-desc-box-${item.venue_id}" style="display:none;">
        <textarea id="reason-desc-${item.venue_id}" rows="2" placeholder="请输入拒绝理由">内容不适宜</textarea>
        <button class="danger" onclick="rejectDesc(${item.venue_id})" style="margin-top:8px;">确认拒绝</button>
      </div>
    `;
    container.appendChild(card);
  });

  notifyTextCount();
}

    async function approve(id) {
      await fetch("https://open.rcwulian.cn/api/venue/review_venue_name.php", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ venue_id: id, action: "approve" })
      });
      alert("已通过");
      loadList();
    }

    async function reject(id) {
      const reason = document.getElementById(`reason-${id}`).value.trim();
      if (!reason) return alert("请输入拒绝理由");

      await fetch("https://open.rcwulian.cn/api/venue/review_venue_name.php", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ venue_id: id, action: "reject", reason })
      });
      alert("已拒绝");
      loadList();
    }

    function toggleReject(id) {
      const box = document.getElementById(`reject-box-${id}`);
      box.style.display = box.style.display === "none" ? "block" : "none";
    }

    async function approveDevice(id, field) {
      const fieldText = field === 'name' ? '设备名称' : '分享名称';
      const confirmed = await auditConfirm(`确认通过该${fieldText}审核？`, '确认通过', 'warning');
      if (!confirmed) return;

      try {
        const res = await fetch("https://open.rcwulian.cn/api/venue/reviewVehicleNameAudit.php", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ device_id: id, field, action: "approve" })
        });
        const result = await res.json();
        if (result.code === 0) {
          await auditAlert(result.msg || '设备审核通过', '处理成功', 'success');
          loadDeviceList();
        } else {
          await auditAlert(result.msg || '设备审核处理失败', '处理失败', 'error');
        }
      } catch (err) {
        console.error('设备审核通过失败:', err);
        await auditAlert('设备审核处理失败，请检查网络或接口', '处理失败', 'error');
      }
    }

    async function rejectDevice(id, field, reason) {
      reason = (reason || '').trim();
      if (!reason) return auditAlert('请输入拒绝理由', '提示', 'warning');

      try {
        const res = await fetch("https://open.rcwulian.cn/api/venue/reviewVehicleNameAudit.php", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ device_id: id, field, action: "reject", reason })
        });
        const result = await res.json();
        if (result.code === 0) {
          await auditAlert(result.msg || '设备已拒绝', '处理成功', 'success');
          loadDeviceList();
        } else {
          await auditAlert(result.msg || '设备拒绝处理失败', '处理失败', 'error');
        }
      } catch (err) {
        console.error('设备审核拒绝失败:', err);
        await auditAlert('设备审核处理失败，请检查网络或接口', '处理失败', 'error');
      }
    }

    function toggleRejectDevice(id, field) {
      const fieldText = field === 'name' ? '设备名称' : '分享名称';
      openDeviceRejectModal(id, field, fieldText, '');
    }

    async function approveDesc(id) {
      await fetch("https://open.rcwulian.cn/api/venue/review_venue_description.php", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ venue_id: id, action: "approve" })
      });
      alert("描述审核通过");
      loadDescList();
    }

    async function rejectDesc(id) {
      const reason = document.getElementById(`reason-desc-${id}`).value.trim();
      if (!reason) return alert("请输入拒绝理由");

      await fetch("https://open.rcwulian.cn/api/venue/review_venue_description.php", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ venue_id: id, action: "reject", reason })
      });
      alert("描述已拒绝");
      loadDescList();
    }

    function toggleRejectDesc(id) {
      const box = document.getElementById(`reject-desc-box-${id}`);
      box.style.display = box.style.display === "none" ? "block" : "none";
    }

    function notifyTextCount() {
      const count = 
        document.querySelectorAll('#audit-list tr').length +
        document.querySelectorAll('#desc-audit-list tr').length +
        document.querySelectorAll('#device-audit-list tr').length;
      window.parent.postMessage({ type: 'text-card-count', count }, '*');
    }

    loadList();
    loadDeviceList();
    loadDescList();
  </script>
<script>

         let ossConfig = null; 
                
                // 页面加载时获取场地列表和OSS配置 
        window.onload = async function() {
            try {
                // 获取 OSS 配置
                const configResponse = await fetch('https://open.rcwulian.cn/api/operat/upload.php?get_config=1'); 
                const configData = await configResponse.json(); 
                if (configData.code === 0) { 
                    ossConfig = configData.data; 
                }
        
                // 加载待审核图片
                loadPendingImages();
        
            } catch (e) {
                console.error('初始化失败:', e);
            }
        }

function loadPendingImages() {
    fetch('https://open.rcwulian.cn/api/venue/getPendingImages.php')
        .then(res => res.json())
        .then(data => {
            const container = document.getElementById('image-list');
            const loading = document.getElementById('loading');
            loading.style.display = 'none';

            if (data.code === 0 && data.data.length > 0) {
                 data.data.sort((a, b) => new Date(b.upload_time) - new Date(a.upload_time));
                data.data.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'venue-card';
                    const reviewType = item.review_type === 'voice_room_background'
                        ? 'voice_room_background'
                        : 'venue_avatar';
                    const reviewId = String(item.review_id || '').replace(/[^A-Za-z0-9_-]/g, '');
                    const rawImageUrl = String(item.image_url || '');
                    const imageUrl = /^https?:\/\//i.test(rawImageUrl)
                        ? rawImageUrl
                        : 'https://open.rcwulian.cn/api/venue/' + rawImageUrl.replace(/^\/+/, '');
                    const typeText = reviewType === 'voice_room_background'
                        ? '语音房背景图'
                        : '场地头像';
                    card.innerHTML = `
                    <img class="venue-img" alt="待审核图片">
                        <div class="venue-info">
                            <span class="venue-name"></span>
                            <span class="review-type"></span>
                            <span class="venue-id"></span>
                            <span class="review-status"></span>
                            <span class="upload-time"></span>
                        </div>
                        <div class="venue-actions">
                            <button class="edit-btn approve-btn">审核通过</button>
                            <button class="edit-btn reject-btn" style="background-color:#f44336">拒绝</button>
                        </div>
                    `;

                    const image = card.querySelector('.venue-img');
                    image.src = imageUrl;
                    image.onclick = () => showModal(imageUrl);
                    card.querySelector('.venue-name').textContent = item.venue_name || '未知场地';
                    card.querySelector('.review-type').textContent = '审核类型: ' + typeText;
                    card.querySelector('.venue-id').textContent = '场地ID: ' + item.id;
                    card.querySelector('.review-status').textContent = '状态: ' + (item.image_status || 'pending');
                    card.querySelector('.upload-time').textContent = '上传时间: ' + (item.upload_time || '-');
                    card.querySelector('.approve-btn').onclick = () => {
                        approveImage(Number(item.id), reviewType, reviewId, card);
                    };
                    card.querySelector('.reject-btn').onclick = () => {
                        rejectImage(Number(item.id), reviewType, reviewId, card);
                    };

                    container.appendChild(card);
                });
                 // ✅ 主动通知父页面
                setTimeout(notifyParentCount, 100);
            } else {
                container.innerHTML = '<div class="loading">暂无待审核图片或文字</div>';
                notifyParentCount(); // 如果没图也要通知 count=0
            }
        })
        .catch(error => {
            document.getElementById('loading').innerText = '加载失败';
            console.error('加载失败：', error);
        });
}

async function approveImage(venueId, reviewType = 'venue_avatar', reviewId = '', cardElement = null) {
    if (reviewType === 'voice_room_background') {
        return reviewVoiceRoomBg(venueId, reviewId, 'approve');
    }

    if (!confirm("确认通过该图片审核，并设为场地头像？")) return;

    const card = cardElement || document.querySelector(`.venue-card button[onclick="approveImage(${venueId})"]`).closest('.venue-card');
    const imgUrl = card.querySelector('img').getAttribute('src');

    try {
        const response = await fetch(imgUrl);
        const blob = await response.blob();

        if (blob.size < 100) {
            alert("图片太小或无效，上传中止");
            return;
        }

        const formData = new FormData();
        formData.append('file', blob, `venue_${venueId}.jpg`);
        formData.append('action', 'update_venue_pictrue');
        formData.append('venue_id', venueId);

        const uploadRes = await fetch('https://rcwulian.cn/app/img/userimg/upload_profile.php', {
            method: 'POST',
            body: formData
        });

        const uploadData = await uploadRes.json();
        if (uploadData.code === 0) {
            alert("上传成功，头像已更新");

            // 删除待审核图片
            const filename = imgUrl.split('/pending_images/')[1]; // 取文件名
            const deleteRes = await fetch('https://open.rcwulian.cn/api/venue/deletePendingImage.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    venue_id: venueId,
                    filename: `pending_images/${filename}`
                })
            });
            const deleteText = await deleteRes.text();
            console.log("🧹 删除图片响应文本：", deleteText);

            location.reload();
        } else {
            alert("上传失败：" + uploadData.msg);
        }

    } catch (e) {
        console.error("上传异常：", e);
        alert("图片审核处理失败，请检查网络或服务器");
    }
}

async function rejectImage(venueId, reviewType = 'venue_avatar', reviewId = '', cardElement = null) {
  
    

    // 缓存驳回理由到 localStorage
    // localStorage.setItem(`rejected_reason_${venueId}`, reason);

    // 找到图片 URL 并提取 filename
    const reason = prompt("请输入拒绝原因：", "内容不适宜");
    if (!reason) return;
    if (reviewType === 'voice_room_background') {
        return reviewVoiceRoomBg(venueId, reviewId, 'reject', reason);
    }

    const rejectRes = await fetch('https://open.rcwulian.cn/api/venue/rejectImage.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            venue_id: venueId,
            reason: reason
        })
    });

    const card = cardElement || document.querySelector(`.venue-card button[onclick="rejectImage(${venueId})"]`).closest('.venue-card');
    const imgUrl = card.querySelector('img').getAttribute('src');
    const filename = imgUrl.split('/pending_images/')[1];

    // 删除图片 + 还原 image_status
    const deleteRes = await fetch('https://open.rcwulian.cn/api/venue/deletePendingImage.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            venue_id: venueId,
            filename: `pending_images/${filename}`
        })
    });

    const deleteData = await deleteRes.json();
    console.log("🧹 删除图片响应：", deleteData);

    if (deleteData.code === 0) {
        alert('图片已驳回并清理');
        location.reload();
    } else {
        alert('删除失败：' + deleteData.msg);
    }
}

async function reviewVoiceRoomBg(venueId, reviewId, action, reason = '') {
    const actionText = action === 'approve' ? '通过' : '拒绝';
    if (!reviewId) {
        alert('语音房背景图审核记录ID缺失，请刷新页面后重试');
        return;
    }
    if (action === 'approve' && !confirm('确认通过该语音房背景图审核？通过后将立即作为该场地的语音房背景图。')) {
        return;
    }

    try {
        const response = await fetch('https://open.rcwulian.cn/api/venue/reviewVoiceRoomBg.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                venue_id: venueId,
                review_id: reviewId,
                action,
                reason
            })
        });
        const result = await response.json();
        if (result.code === 0) {
            alert(result.msg || `语音房背景图已${actionText}`);
            location.reload();
        } else {
            alert(result.msg || `语音房背景图${actionText}失败`);
        }
    } catch (error) {
        console.error('语音房背景图审核失败：', error);
        alert('语音房背景图审核处理失败，请检查网络或服务器');
    }
}

 function showModal(imageUrl) {
        let modal = document.getElementById('img-modal');
        if (!modal) {
            modal = document.createElement('div');
            modal.id = 'img-modal';
            modal.className = 'modal';
            modal.innerHTML = `<img class="modal-content" id="modal-img">`;
            modal.onclick = () => (modal.style.display = 'none');
            document.body.appendChild(modal);
        }
        const img = modal.querySelector('#modal-img');
        img.src = imageUrl;
        modal.style.display = 'block';
    }
 // 方法2：页面加载完后主动告诉父页面
  function notifyParentCount() {
    const count = document.querySelectorAll('.venue-card').length;
    window.parent.postMessage({ type: 'image-card-count', count }, '*');
  }
